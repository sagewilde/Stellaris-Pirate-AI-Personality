## Hostile
 DFLT_CR_HOSTILE_GREETING_01:0 "Pirates!"
 CORP_CR_HOSTILE_GREETING_01:0 "Pirates!"
 MECH_CR_HOSTILE_GREETING_01:0 "Pirates!"
