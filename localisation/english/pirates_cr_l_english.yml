# Rivalry
## Declaring Rivalry
 CR_MAKE_RIVAL_SELECT_01:0 "A grave error on your part."
 CR_MAKE_RIVAL_SELECT_PE:0 "Oh? You're approaching me? Instead of running away, you're coming right to me?"
 CR_END_RIVAL_SELECT:0 "Have you grown bored of our little game of cat and mouse, then?"
 CR_DFLT_MAKE_RIVAL_PROPOSE:0 "You [Root.GetSpeciesAdj] have made yourselves fat and comfortable on your throne of riches. The light of its shine only drew the eyes of the shadows that would circle around such beauty. And we, the darkness waiting in the wings, will not rest until your empire has crumbled into ruin, and we sit atop your hoard!"
 CR_CORP_MAKE_RIVAL_PROPOSE:0 "You [Root.GetSpeciesAdj] have made yourselves fat and comfortable on your deposits and stocks. The light of its shine only drew the eyes of the shadows that would circle around such beauty. And we, the darkness waiting in the wings, will not rest until your company has crumbled into ruin, and we sit atop your hoard!"
 CR_PE_MAKE_RIVAL_PROPOSE:0 "You pathetic, worthless scum. You shivering, scurvy traitors! You've shown yourselves to be capable brigands. You've been given chances to join us. And you've spit on our pride! Now, you face our sworn oath; you will belong to us! You will belong to the [Root.GetRulerTitle]!"
## Accepting Rivalry
 CR_DFLT_MAKE_RIVAL_ACCEPT:0 "Ha! Excellent! We'll gladly take the challenge. Your [From.GetRemnantNamePlural] will make fine ornaments for the prows of our warships!"
 CR_PE_MAKE_RIVAL_ACCEPT:0 "Oh ho! Then come as close as you like!"
## Ending Rivalry - Friendly
 CR_DFLT_END_RIVALRY_FRIENDLY:0 "We've grown tired of this farce. Your little local squabbles hold no interest to the [Root.GetRulerTitle]. You may go."
 CR_CORP_END_RIVALRY_FRIENDLY:0 "We've grown tired of this farce. Your little lemonade stand holds no interest to the [Root.GetRulerTitle]. You may go."
 CR_PE_END_RIVALRY_FRIENDLY:0 "We've grown tired of this farce. Your childish fantasies of adventure hold no interest to the [Root.GetRulerTitle]. You may go."
## Ending Rivalry - Neutral
 CR_DFLT_END_RIVALRY_NEUTRAL:0 "You and the rest of your impoverished peons have nothing to offer the [Root.GetName]. Your little toy rockets aren't worth the glue they're slapped together with. Don't bother looking for a fight. You're not worth the ammunition."
 CR_CORP_END_RIVALRY_NEUTRAL:0 "You and the rest of your impoverished office interns have nothing to offer the [Root.GetName]. Your flying death-traps aren't worth the trash they haul. Don't bother looking for a fight. You're not worth the ammunition."
 CR_PE_END_RIVALRY_NEUTRAL:0 "You and the rest of your impoverished castaways have nothing to offer the [Root.GetName]. Your third-hand dinghies couldn't fight a blind amoeba. Don't bother looking for a fight. You're not worth the ammunition."
## Ending Rivalry - Hostile
 CR_END_RIVALRY_HOSTILE:0 "This isn't over, [From.GetSpeciesNamePlural]. Rest assured, we will come back. And your little [From.Capital.GetName] will be ours!"
## Ending Rivalry - Acceptance
 CR_DFLT_END_RIVALRY_ACCEPT:0 "How typical of the [From.GetName] to preen and posture, as if they're immune to projectiles. Keep prancing, you weak, lily-livered fools."
 CR_CORP_END_RIVALRY_ACCEPT:0 "How typical of the [From.GetName] to veil their arrogance behind their duplicitous Corporatese. Your silver tongues won't save you, not when we cut them from your heads!"
 CR_PE_END_RIVALRY_ACCEPT:0 "You will submit to the rule of the [Root.GetName] eventually. It is inevitable. [Root.GetRulerTitle] is the rightful Lord of Pirates, and you will submit to [Root.Leader.GetHerHim]!"

