### Cunning Raiders ###
# Greetings
## Hostile
 CR_HOSTILE_GREETING_01:0 "You dare to have such audacity? To approach the terrible [Root.GetRulerName]'s feet, the Lord of Pirates? You're not worthy of my grace, worm."
 CR_HOSTILE_GREETING_02:0 "We'll strip your ships bare before we sink them into the closest star. And if you have [From.GetSpeciesSpawnNamePlural] on them, we'll tie them up next to a viewport so they can watch their parents burn."
 CR_HOSTILE_GREETING_03:0 "You should know something. It's people like you who break first. The ones with such flowery ideals about justice and the worth of trash. You'll be a sobbing puddle of filth by the time I'm done with you."
 CR_HOSTILE_GREETING_04:0 "You should know something. It's people like you who break first. The ones with such haughty notions of your own self-worth. You all shut up real quick once you realize you're filth."
 CR_HOSTILE_GREETING_MECH_01:0 "If you like where all your parts are bolted, you'll think about addressing the [Root.GetRulerTitle] with more respect."
 CR_HOSTILE_GREETING_MECH_02:0 "I look at you and your drones, and do you know what I see? Scrap. Scrap that will be recycled into a brand new [Root.GetAdjective] fleet."
 CR_HOSTILE_GREETING_HM_01:0 "You seem to operate under the assumption that the wrath of the swarm is the most feared thing in the galaxy. You're a cloud of minnows. You're swimming with sharks now."
 CR_HOSTILE_GREETING_HM_02:0 "Your arrogance is second only to your value, luckily for you. Once we've severed each master node from your collective, you'll be the largest and most biddable haul of slaves we've ever taken as a prize."
 CR_HOSTILE_GREETING_CORP_01:0 "You've been very quiet since we mailed you the head of the last asset protection officer you dared to send after us. Is the cost of business too high for you, [From.GetSpeciesNamePlural]?"
 CR_HOSTILE_GREETING_CORP_02:0 "Just think of it as being competitive in the market, [From.GetSpeciesNamePlural]. If you don't fly, you fall. And you, my arrogant little [From.GetSpeciesNamePluralInsult], will fall."
 CR_HOSTILE_GREETING_MB:0 "If I hear one more 'arr' or 'shiver me timbers' out of you, I will space you myself!"
 CR_HOSTILE_GREETING_PE:0 "You call yourselves pirates. You're all fakers! Pretenders! You deserve nothing more than to be stuffed down the barrel of a mass driver and shot into a star!"
## Neutral
 CR_NEUTRAL_GREETING_01:0 "We are the [Root.GetName], and we are the shadow cast by the great [Root.GetRulerTitle] [Root.GetRulerName]"
 CR_NEUTRAL_GREETING_02:0 "You are permitted to speak in the presence of the [Root.GetRulerTitle]. You are invited to offer [Root.Ruler.GetHerHim] proper tribute."
 CR_NEUTRAL_GREETING_03:0 "If you are too weak to protect what is yours, then you do not deserve to keep it. Your ships, your valuables, or your freedom, it is all the same to the [Root.GetName]."
 CR_NEUTRAL_GREETING_04:0 "Only two things matter, [From.GetSpeciesNamePlural]: Power, and obedience. There is a natural order, and we are its instrument in the void. Fall in line, and kneel to the Pirate Lord!"
 CR_NEUTRAL_GREETING_SLV_01:0 "The [Root.GetRulerTitle] foresees a profitable relationship between us. We take the ships, and you take the captives. What do you say?"
 CR_NEUTRAL_GREETING_SLV_02:0 "It would seem we are peers in a lucrative trade. Would you care to observe our overseers at work? Perhaps we could compare knowledge on how best to break a new slave."
 CR_NEUTRAL_GREETING_CORP_01:0 "If it is profit you seek, then you would do well to remain on our good side, [From.GetSpeciesNamePlural]. We can either be excellent business partners, or... cutthroat competitors."
 CR_NEUTRAL_GREETING_CORP_02:0 "Your organization, our armaments; we could rule this galaxy, if you are willing to yield to our terms. If not, then we'll see if you're able to keep those fat coffers in your feeble [From.GetSpeciesHandNamePlural]."
 CR_NEUTRAL_GREETING_HM:0 "A single entity with many bodies? How convenient, to only have to control one head to bend the will of multitudes."
 CR_NEUTRAL_GREETING_MECH_01:0 "Machines are tools, and belong in the [Root.GetSpeciesHandName] of one who will wield them. If a tool that doesn't obey that [Root.GetSpeciesHandName]'s will, then it is broken, and must be discarded. Will you obey, [From.GetName]? Or be discarded?"
 CR_NEUTRAL_GREETING_MECH_02:0 "Never hungry, never thirsty, never tired. And when one part fails, another is ready to replace it. An ideal form, for either a master or a slave. Don't you agree, [From.GetSpeciesNamePlural]?"
 CR_NEUTRAL_GREETING_PAC:0 "So, your species does not fight? Weak, submissive... dominable. Perfect."
 CR_NEUTRAL_GREETING_MIL:0 "The void is a dangerous place, [From.GetSpeciesNamePlural]. Danger lurks behind every asteroid, hides in the corona of every star. Tell us, do you hunt those dangers, or do you merely ward off the night while the buzzards circle you?"
 CR_NEUTRAL_GREETING_AUT:0 "If you seek to bring the [Root.GetName] under your sphere of influence, you will find us to be more than a match for your will. But, should you require a bleeding heart nuisance to be eliminated, we might find common cause. Might."
 CR_NEUTRAL_GREETING_EGL:0 "You believe that all beings are equal? Mwahahaha. How quaint. How weak."
 CR_NEUTRAL_GREETING_MAT:0 "A mind is a terrible thing to waste. And fools do not deserve the attention or mercy of their betters. Don't you agree, [From.GetRulerTitle]?"
 CR_NEUTRAL_GREETING_SPR:0 "How heady a feeling it must be, to be the chosen voice of terrible and powerful beings. But when our lessers do not know the difference between the voice of a god and the voice of a god's agents, it can be a little like being a god yourself. Isn't that right, O [From.GetRulerTitle]?"
 CR_NEUTRAL_GREETING_XPB:0 "We are alike in our knowledge that other beings are our lessers. Where we disagree is who precisely is inferior. If you've a mind for profit, we foresee a mutually beneficial understanding. Antagonize us, and you will know our flag means death."
 CR_NEUTRAL_GREETING_XPL:0 "If you believe that you will find an unlikely friend within us, [From.GetSpeciesNamePlural], you are more naïve and misguided than we assumed."
 CR_NEUTRAL_GREETING_SOC:0 "'From each according to his ability, to each according to his need', you say? Well. Then you should be more than capable of giving us everything we need."
 CR_NEUTRAL_GREETING_CAP:0 "The pursuit of profit is a noble cause. A noble cause is worth shedding blood for. And if someone must bleed, it should be those who are too weak and too stupid to take what they desire. Don't you agree?"
 CR_NEUTRAL_GREETING_ECO:0 "Every wild beast knows its place in the food chain. We are the apex predators, the king of beasts, and the void is our jungle. Now, the [Root.GetRulerTitle] asks you; are you predator, or prey?"
 CR_NEUTRAL_GREETING_IND:0 "A mighty navy needs a mighty army of engineers, builders, and craftsmen to keep it from wasting away into rust and plasma. The industry of war is what drives all others, and each cog in that great machine grinds the weak into meal."
 CR_THREATENED_GREETING:0 "You only get one warning, [From.GetSpeciesNamePlural]. The [Root.GetAdj] are not known for going quietly. Try to take us, and we will raise hell like you've never known!"
## Friendly
 CR_FRIENDLY_GREETING_01:0 "Few have stood in the company of the most feared pirates in the galaxy without risking life and limb. Even fewer have the privilege of our good graces. Here's to our profitable partnership, me hearties!"
 CR_FRIENDLY_GREETING_02:0 "A moment, if you please. The execution of this scurvy deserter must be seen to. But once this miserable [Root.GetSpeciesNameInsult]'s [Root.GetRemnantName] has been impaled on my ship's prow as a new figurehead, we shall be free to conduct business."
 CR_FRIENDLY_GREETING_03:0 "A fine day for a bloodbath."
 CR_FRIENDLY_GREETING_04:0 "Fifteen [Root.GetSpeciesNamePlural] on a Dead Man's Chest; Yo ho ho, and potent potables. Drink, and the Eater be damned for the rest; Yo ho ho, and potent potables!"
 CR_FRIENDLY_GREETING_CORP_01:0 "The arrangement we have is a beneficial one. It pleases the [Root.GetRulerTitle] to know that our targets align so cleanly."
 CR_FRIENDLY_GREETING_CORP_02:0 "Money makes the galaxy go 'round, [From.GetSpeciesNamePlural]. And as long as that money is in someone else's pocket, we shall have work to do."
 CR_FRIENDLY_GREETING_AQU:0 "We are as the riptide, you and I. We are unseen and unheard, until our victims are too far from safety to be saved."
 CR_FRIENDLY_GREETING_MECH_01:0 "There is nothing quite as satisfying as observing the flawless work of a high-performance machine. Like a well-maintained impact driver, a powerful hyperdrive, or a [From.GetAdj] [From.GetSoldier]."
 CR_FRIENDLY_GREETING_MECH_02:0 "A weapon is only as good as its ability to hit a target. With the [Root.GetAdj] armada as the barrel, and [From.GetRulerName] as the sights, there is no obstacle we can't destroy."
 CR_FRIENDLY_GREETING_HM:0 "The [From.GetName] comes to call on [Root.GetRulerName]? To what do we owe the pleasure of this visit, o mighty multitude? A new threat, or a new opportunity?"
 CR_FRIENDLY_GREETING_MIL:0 "The [Root.GetName] has flourished under our cooperation. There are none in this galaxy that can compare to the strength of our combined forces. The horizon is ripe for plunder, and the [From.GetAdj] military is promised its fair share of the booty!"
 CR_FRIENDLY_GREETING_CAP:0 "Wealth is all that matters. There is no power in this galaxy that can compare to a deep cache of diverse assets. And it feels so good to see the hoard grow, don't you agree?"
 CR_FRIENDLY_GREETING_AUT:0 "Our combined dominance is undeniable. The quivering masses of this galaxy will bend the knee before the [Root.GetRulerTitle] and [From.GetRulerTitle] [From.GetRulerName]!"
 CR_FRIENDLY_GREETING_SLV:0 "Ah, our favorite clients! I think you'll find the stock we acquired from our last raid most vigorous."
## War
 CR_WAR_GREETING_01:0 "I am going to feed you your own [From.GetSpeciesToothNamePlural], one by one, until you tell me exactly where your treasure is hidden!"
 CR_WAR_GREETING_02:0 "You had better be here to beg, [From.GetSpeciesNamePluralInsult]. Or else offer the [Root.GetRulerTitle] something very, very expensive."
 CR_WAR_GREETING_03:0 "The [Root.GetRulerTitle] is only interested in hearing the sound of you pleading for mercy. All else is just blubbering and [From.GetRandomSpeciesSound]."
 CR_WAR_GREETING_MECH:0 "I am going to pull out your cables, one by one, and start plugging them into high-voltage power cells. And I will keep doing it until you tell me where your treasure is hidden!"
 CR_WAR_GREETING_PE:0 "You pathetic, quivering, [From.GetRandomSpeciesSound] [From.GetSpeciesNamePluralInsult]! You're all yellow-bellied cowards! You're all unworthy of calling yourselves cutthroats and scoundrels!"

# Subjugation/Vassalization
## Demanding Vassalization
 CR_DEMAND_VASS_SELECT_01:0 "I would accuse you of having a sense of humor, [From.GetSpeciesNamePlural], if I believed you intelligent enough to understand it."
 CR_DEMAND_VASS_SELECT_02:0 "Your arrogance is unforgivable, [From.GetSpeciesNamePluralInsult]. I should kill you for this insult!"
 CR_DEMAND_VASS_PROPOSE:0 "The [From.GetRulerTitle], Scourge of the Stars, Greatest Among Pirates, demands that you submit to the rule of [From.Capital.GetName]. This is your only chance to accept, [Root.GetSpeciesNamePlural], before our warships open fire on your vessels."
 CR_DEMAND_VASS_ACCEPT_01:0 "You are fortunate that such an arrangement is to our advantage."
 CR_DEMAND_VASS_REFUSE_01:0 "HA! HAHAHA! Your foolishness is amusing. You parade about, thinking yourselves [From.GetSpeciesNamePluralCompliment], kings among stars, and that the [Root.GetSpeciesNamePlural] would bow to you? Pathetic."
## Asking for Vassalization 
 CR_ASK_FOR_VASS_SELECT:0 "I like the way you grovel, [From.GetSpeciesNamePlural]."
 CR_ASK_FOR_VASS_PROPOSE:0 "... The [From.GetRulerTitle] is forced to concede [From.Leader.GetHerHis] superiority to the [Root.GetName]. Do what you must... masters."
 CR_ASK_FOR_VASS_ACCEPT:0 "An entire nation of obedient [From.GetAdj] slaves. I like it."
 CR_ASK_FOR_VASS_REFUSE:0 "Feh. You're not worth the expenditure, [From.GetSpeciesNameInsult]. Slaves are expensive to keep."
## Subsidiaries
 CR_DEMAND_SUBS_SELECT:0 "You dare to impugn the right of the Lord of Pirates?! We'll send your envoy back in pieces!"
 CR_DEMAND_SUBS_PROPOSE:0 "The buccaneer armada of the [From.GetName] is willing to offer you an opportunity. We seek to expand our horizons and enlarge both our fortunes. Join us, [Root.GetSpeciesNamePlural], or die."
 CR_DEMAND_SUBS_ACCEPT_01:0 "It pains us to accept this. But having weighed our options, we have little choice. We'll be part of your... business."
 CR_DEMAND_SUBS_ACCEPT_02:0 "To be brought so low, by such [From.GetSpeciesNamePluralInsult]; To be the Lord of Pirates no more. A curse on all of you!"
 CR_DEMAND_SUBS_REFUSE:0 "Ha! Enjoy scraping your envoy's [From.GetRemnantName] from the side of your vessel, impertinent scum! We sell our right to no one!"
 CR_ASK_FOR_SUBS_SELECT:0 "Wise of you to acknowledge the rightful Master of All Pirates."
 CR_ASK_FOR_SUBS_PROPOSE:0 "... The [From.GetRulerTitle] is forced to concede [From.Leader.GetHerHis] fiscal control to the [Root.GetName]. Do what you must... boss."
 CR_ASK_FOR_SUBS_ACCEPT:0 "The expansion of our enterprise is cause for celebration. Come, let us drink until the stars explode!"
 CR_ASK_FOR_SUBS_REFUSE:0 "Your crumbling assets would only bankrupt our organization. We don't accept sinking ships in our mighty armada!"
## Tributaries
 CR_DEMAND_TRIBUTARY_SELECT:0 "The [From.GetSpeciesNamePluralInsult], asking US for tribute? You dare?!"
 CR_DEMAND_TRIBUTARY_PROPOSE:0 "The dreaded [From.GetRulerName] demands that the [Root.GetName] yield its wealth and assets to the mighty [From.GetName], most feared of all pirates! Refuse us, you cowering [Root.GetSpeciesSpawnNamePlural], and we will take it by force!"
 CR_DEMAND_TRIBUTARY_ACCEPT:0 "... fine."
 CR_DEMAND_TRIBUTARY_REFUSE:0 "Mates! Blast these scurvy [From.GetSpeciesNamePluralInsult] into atoms!"
 CR_ASK_BECOME_TRIBUTARY_SELECT:0 "So, you snivelling cowards finally see reason. Excellent."
 CR_ASK_BECOME_TRIBUTARY_PROPOSE:0 "... this is wrong. This is so terribly wrong."
 CR_ASK_BECOME_TRIBUTARY_ACCEPT:0 "Such fine, shiny trinkets. We will expect such regular payment from you, [From.GetSpeciesNamePlural]. You may live. For now."
 CR_ASK_BECOME_TRIBUTARY_REFUSE:0 "You miserable bilge-sucking [From.GetSpeciesNamePlural] have no wealth! You can pay us with your [From.GetBloodType]!"
## Releasing Subjects
 CR_RELEASE_SUBJECT_SELECT:0 "So, your amusement with us is finally at an end?"
 CR_RELEASE_SUBJECT_PROPOSE:0 "The [From.GetName] has bled your coffers dry, and siezed everything that can fit into our holds. You have nothing left to offer us, [Root.GetSpeciesNamePlural]. Consider our arrangement at an end. You have ten seconds to start running."
 CR_RELEASE_SUBJECT_ACCEPT:0 "Finally. Free. Free at last! The [Root.GetName] will rise again!"
 CR_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Ha! Hahahaha! You, want to be released? Tell another one."
 CR_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "The [From.GetName] has decided that we are finished being your petty little playthings. No one toys with the [From.GetSpeciesNamePlural]! No one! Release us, or our mutiny will burn your precious [Root.Capital.GetName] to nuclear ash!"
 CR_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Oh, we suppose that we've bled you dry for everything you have. Fine. Now... start running."
 CR_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "You still have dues to pay us, [From.GetSpeciesAdj] slime. And until we've taken everything you have, you're not getting away from us!"
## Vassal Greetings
 CR_VASSAL_GREETING_01:0 ""
 CR_VASSAL_GREETING_02:0 ""
 CR_VASSAL_GREETING_DISLOYAL_01:0 "Gloat while you can, [From.GetSpeciesNamePlural]. One day, you'll wake up with your own [From.GetSpeciesOrganNamePlural] in your [From.GetSpeciesToothNamePlural]!"
 CR_VASSAL_GREETING_DISLOYAL_02:0 "Grrr... Whatever you have to ask from us, make it quick."
