  ### Cunning Raiders - Hostile
  ### 'Root' is self, 'From' is the sender. Switches with insults, for some ungodly reason.
  CR_HOSTILE_GREETING_01:0 ""
  CR_HOSTILE_GREETING_02:0 "Our vast navy stands ready to plunder the galaxy of all its riches. Starting with you, if you don't feel the need to kiss the ring."
  CR_HOSTILE_GREETING_03:0 ""
  CR_HOSTILE_GREETING_04:0 ""
  CR_HOSTILE_GREETING_05:0 ""
  CR_HOSTILE_GREETING_06:0 ""
  CR_HOSTILE_GREETING_07:0 ""
  CR_HOSTILE_GREETING_MB_01:0 "If I hear one more 'arr' or 'shiver me timbers' out of you, I will space you myself!"
  CR_HOSTILE_GREETING_MB_02:0 "You call yourselves pirates. You're cosplayers! Pretenders! Fakes and phonies unworthy to serve under the [Root.GetRulerTitle]! You deserve nothing more than to be stuffed down the barrel of a mass driver and shot into a star!"
  CR_HOSTILE_GREETING_MECH_01:0 "If you like where all your things are bolted, you'll think about addressing the [Root.GetRulerTitle] with more respect."
  CR_HOSTILE_GREETING_MECH_02:0 "I look at you and your planets, and do you know what I see? Scrap. Scrap that will be recycled into a brand new [Root.GetAdjective] fleet."
  CR_HOSTILE_GREETING_HM_01:0 "You seem to operate under the assumption that the wrath of the swarm is the most feared thing in the galaxy. You're a cloud of minnows. You're swimming with sharks now."
  CR_HOSTILE_GREETING_HM_02:0 "There really are no slaves more perfect than a hive mind. All you need to do is control one crucial head, and the rest fall in line."
  CR_HOSTILE_GREETING_CORP_01:0 ""
  CR_HOSTILE_GREETING_CORP_02:0 ""
  CR_HOSTILE_GREETING_CORP_03:0 ""
  CR_HOSTILE_GREETING_CORP_04:0 ""

