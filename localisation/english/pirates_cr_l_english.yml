## Insults targeting CR
 CR_INSULT_MB_01:0 "Too late to be known as [Root.GetRulerName] the First, [Root.Ruler.GetSheHe] [Root.Ruler.GetIsAre] sure to be known as [Root.GetRulerName] the Worst! A pox on the phony king of pirates! Oo-de-lally!"
 CR_INSULT_MB_02:0 "Yar-har-har! Shiver me fuselage! Blow me down! Secure the vol-mote chest! Smeegibb, cast off the hawser!"
 CR_INSULT_DEFAULT_01:0 "You look like you need to eat more oranges. Perhaps a few thousand of them."
 CR_INSULT_HUMAN_01:0 "You're no Blackbeard. You're not even a Dread Pirate Roberts! You're Robbie Rotten!"
## Insults sent by CR
 CR_INSULT_01:0 "The [Root.GetAdjective] envoy strides arrogantly into the [From.GetRulerTitle]'s office. With a haughty, wicked grin, they throw a bag onto [From.Leader.GetHerHis] desk. Inside is the severed head of a [From.GetSpecies]!"
 CR_INSULT_02:0 "When I became [Root.GetRulerTitle], I had to jettison my predecessor from an airlock to prove that I was a worthy leader. When I make you walk the ramp, your [From.GetSpeciesSpawnName] will weep before I make them follow you."
