## Friendly
 DFLT_CR_FRIENDLY_GREETING_01:0 "We're xenos of the same mind, you and I. There are the weak, and there are the strong. The natural order sorts itself out nicely."
 DFLT_CR_FRIENDLY_GREETING_SLV:0 "Ah, the [Root.GetSpeciesNamePlural]! The last shipment of slaves you sent just sold last night, and for quite a tidy profit. We'll be ordering another ship from you in the near future."
 DFLT_CR_FRIENDLY_GREETING_MIL:0 "[Root.GetSpeciesNamePlural]! We were just about to discuss a tactical fleet maneuver, and my commander disagrees with me. Perhaps some privateer insights are what we need. Say you're faced with a..."
 DFLT_CR_FRIENDLY_GREETING_CAP:0 "When it comes to hired guns and competent muscle, nothing compares to [Root.GetAdjective] privateers. You truly do offer a premium service, my fine friend."
 DFLT_CR_FRIENDLY_GREETING_CRIM:0 "With our combined fleets, we are unstoppable. Together, the galaxy is a treasure vault ripe to be smashed open!"
 CORP_CR_FRIENDLY_GREETING_01:0 "Welcome to the [From.GetName]. Would you like a tour of the company fighting pit? ... Ball pit? Why in the worlds would we have a ball pit?"
 CORP_CR_FRIENDLY_GREETING_02:0 "Hey, there [Root.Leader.GetSheHe] [Root.Leader.GetIsAre]! There's my favorite dirty rotten pirate! The last blockade runner you sent really brought the good stuff! We can't keep it on the shelves! You're absolute geniuses at cutting red tape. And cutting throats, for that matter."
 CORP_CR_FRIENDLY_GREETING_03:0 "You're a mean, lean, deal-making machine! You smell that? That, my friend, is the smell of a new 10,000 credit fleet revving up the engines!"
 CORP_CR_FRIENDLY_GREETING_04:0 "We have a simple relationship; we're the brains, and you're the brawn. I cook the books, and you cook the competition."
 CORP_CR_FRIENDLY_GREETING_05:0 "Welcome back, [Root.GetRulerTitle] [Root.GetRulerName]. Your usual cabin is prepared, with planet-side view and complimentary chamber service. I think you'll like the servants we've assigned to you for your visit."
 MECH_CR_FRIENDLY_GREETING_01:0 "[Root.GetAdjective] assets have proven to be useful to our goals. We calculate current gain-to-expenditure ratios as exceptionally favourable."
 MECH_CR_FRIENDLY_GREETING_02:0 "We are receiving you, [Root.GetRulerTitle]. We trust that our calculated list of potential trade route targets has been illuminating."
 HM_CR_FRIENDLY_GREETING_01:0 "May the song of our collective harmonize with your war shanties, and shake the very stars."
 HM_CR_FRIENDLY_GREETING_02:0 "The [From.GetSpeciesNamePlural] welcome you, most feared lord of all pirates."

# Concerning Hippies
 CR_PC_WAR_GREETING_01:0 "The slave chips we install in our assets are very versatile. Did you know they can override your ability to speak? Our captains are rejoicing. We won't have to hear your pathetic, mewling protest chants."
 PC_CR_NEUTRAL_GREETING_01:0 "I've met some dudes with some *seriously* bad vibes. On a scale of 1 to 10, I've had to downgrade the old '10' to an '8'. That's not a compliment."
 CR_PC_NEUTRAL_GREETING_01:0 "There is some debate among the captains if lazy, shiftless sacks of flesh like you are even worth taking as slaves."
 PC_CR_HOSTILE_GREETING_01:0 "Pardon my language, but Karma is a bitch. Seriously, we've been talking, and she does not like you. You literally exist to do harm, and the universe doesn't take kindly to such bad vibes."
 CR_PC_HOSTILE_GREETING_01:0 "Go ahead. Chain yourselves to your trees, hippies. Make our job easier when we burn down your forest villages."