 gov_synth_corporate_physical_pirate_desc:0 "$auth_synth_corporate_physical_pirate_desc$"

# Synth Corporate Virtual
 RT_ELITE_HACKER:0 "1337_H4XX0R"
 auth_synth_corporate_virtual_pirate:0 "Net-Pirate Hack-ocracy"
 auth_synth_corporate_virtual_pirate_desc:0 "The key to the treasure of the future isn't in safecracking or explosives, but in decryption; gathering information and secrets. The most dangerous pirates aren't the ones that can shoot down your ships, they're the ones that can turn your own starbase against you with an executed command. Why? 4 teh lulz, obv."

 concept_auth_synth_corporate_virtual_pirate:0 "$auth_synth_corporate_virtual_pirate$"
 gov_synth_corporate_virtual_pirate:0 "$auth_synth_corporate_virtual_pirate$"
 gov_synth_corporate_virtual_pirate_desc:0 "$auth_synth_corporate_virtual_pirate_desc$"

# Cyber Corporate Collectivist
 auth_cyber_corporate_collectivist_pirate:0 "Privateer Cyber-Union"
 auth_cyber_corporate_collectivist_pirate_desc:0 "With cybernetic enhancements ensuring perfect coordination and instantaneous communication on their vessels, the chain of command is seamless and unbreakable.\n\nBut with so many enemies seeking power, it is remarkably easy to simply shut down the captain's brain with a well-packaged virus. Mutiny, too, has evolved as we have."

 gov_cyber_corporate_collectivist_pirate:0 "$auth_cyber_corporate_collectivist_pirate$"
 gov_cyber_corporate_collectivist_pirate_desc:0 "$auth_cyber_corporate_collectivist_pirate_desc$"
 concept_auth_cyber_corporate_collectivist_pirate:0 "$auth_cyber_corporate_collectivist_pirate$"

# Cyber Corporate Individualist
 auth_cyber_corporate_individualist_pirate:0 "Wetwork Wire-ates"
 auth_cyber_corporate_individualist_pirate_desc:0 "A pirate makes his own fate. With bionic weapons and replaceable limbs, every hand on deck is both unique and equally powerful.\n\nWith this vast renegotiation of power comes a new swath of tools that captains must use to maintain order on their vessels. Some may call it hacking. Others may call it statecraft. This has lead to a malware arms' race to maintain political control."
 gov_cyber_corporate_individualist_pirate:0 "$auth_cyber_corporate_individualist_pirate$"
 gov_cyber_corporate_individualist_pirate_desc:0 "$auth_cyber_corporate_individualist_pirate_desc$"
 concept_auth_cyber_corporate_individualist_pirate:0 "$auth_cyber_corporate_individualist_pirate$"

# Bio Purity
 auth_bio_corporate_purity_pirate:0 "Bio-Buccaneer Syndicate"
 auth_bio_corporate_purity_pirate_desc:0 "These pirates have stolen the very secret to life itself. Capable of stealing organs and ransoming them back to their still-living owners, these ransomeers will hold your very own heart hostage if it means they can bleed you dry for every credit. Those who cannot afford the ransom rarely live long enough to seek revenge."

 concept_bio_corporate_purity_pirate:0 "$auth_bio_corporate_purity_pirate$"
 gov_bio_corporate_purity_pirate:0 "$auth_bio_corporate_purity_pirate$"
 gov_bio_corporate_purity_pirate_desc:0 "$auth_bio_corporate_purity_pirate_desc$"

# Bio Cloning
 auth_bio_corporate_cloning_pirate:0 "Corsair Cloners"
 auth_bio_corporate_cloning_pirate_desc:0 "The limits of a ship are dictated by the limits of her crew. So what can one do when the cunning and craft of an organic being is married with the easy replicability of a machine? The result is a navy that is never short of fit, healthy spacers; an insurmountable raiding force, winning through sheer numbers."

 concept_bio_corporate_cloning_pirate:0 "$auth_bio_corporate_cloning_pirate$"
 gov_bio_corporate_cloning_pirate:0 "$auth_bio_corporate_cloning_pirate$"
 gov_bio_corporate_cloning_pirate_desc:0 "$auth_bio_corporate_cloning_pirate_desc$"

# Bio Mutation
 auth_bio_corporate_mutation_pirate:0 "Aberrant Rogues"
 auth_bio_corporate_mutation_pirate_desc:0 "There are few things more dangerous than a criminal that you can never catch. With mutant powers capable of shapeshifting, blasting walls, and even surviving the vacuum of space, these pirates are as diverse as they are deadly."

 concept_bio_corporate_mutation_pirate:0 "$auth_bio_corporate_mutation_pirate$"
 gov_bio_corporate_mutation_pirate:0 "$auth_bio_corporate_mutation_pirate$"
 gov_bio_corporate_mutation_pirate_desc:0 "$auth_bio_corporate_mutation_pirate_desc$"

# EvoPred Pirates
 auth_bio_corporate_evopred_pirate:0 "DNA Freebooters"
 auth_bio_corporate_evopred_pirate_desc:0 "The ill-gotten gains these pirates seek aren't anything that their victims carry in their pockets, but in their bodies. With an enormous wealth of genetic material, this pirate syndicate can adapt to, very literally, anything that their enemies may invent to ensnare them." 

 concept_bio_corporate_evopred_pirate:0 "$auth_bio_corporate_evopred_pirate$"
 gov_bio_corporate_evopred_pirate:0 "$auth_bio_corporate_evopred_pirate$"
 gov_bio_corporate_evopred_pirate_desc:0 "$auth_bio_corporate_evopred_pirate_desc$"

# Shroud Transcendant
 auth_shroud_corporate_transcendant_pirate:0 "Mindscape Marauders"
 auth_shroud_corporate_transcendant_pirate_desc:0 "These pirates haven't had an original thought in ages, because they've stolen all of yours. This pirate syndicate has little interest in taking your ship. They are capable of slipping into a populace and stealing military secrets, political blackmail, and personal passwords.\n\nYou will give your ship to them - and anything else they want - because you will not have a choice."

 concept_shroud_corporate_transcendant_pirate:0 "$auth_shroud_corporate_transcendant_pirate$"
 gov_shroud_corporate_transcendant_pirate:0 "$auth_shroud_corporate_transcendant_pirate$"
 gov_shroud_corporate_transcendant_pirate_desc:0 "$auth_shroud_corporate_transcendant_pirate_desc$"

# Shroud Corporeal
 auth_shroud_corporate_corporeal_pirate:0 "Telekinetic Kleptocracy"
 auth_shroud_corporate_corporeal_pirate_desc:0 "No prison can hold these criminals. When the ability to rip open a bank vault at twenty paces is commonplace, what can possibly stop these pirates from taking what they want, when they want?\n\nWith the ability to make their will manifest, psi-pirates are more capable than ever of building - or breaking - whatever their twisted hearts desire."

 concept_shroud_corporate_corporeal_pirate:0 "$auth_shroud_corporate_corporeal_pirate$"
 gov_shroud_corporate_corporeal_pirate:0 "$auth_shroud_corporate_corporeal_pirate$"
 gov_shroud_corporate_corporeal_pirate_desc:0 "$auth_shroud_corporate_corporeal_pirate_desc$"

# SPACE SHANTY Rebuilt - Melody: "Santiana"
 site_space_shanty_dig_pirate:0 "The Daughter of Kambel"
 space_shanty_intro_pirate:0 "She's like something out of a childhood dream. A vast, beautiful wood and ceramo-metallo alloy ship. Like a hybrid between the most graceful bird and the most regal planetbound sea vessel, she's shaped as if she was raptured from the surface of an ocean world and set to glide in the void. Her long photovoltaic sails shimmer with gold, as if the sunlight she caught in eons past is still there in the hyperglass fibers. Our linguists have managed to translate only her name; 'Daughter of Kambel'.\n\nThis beautiful queen of the Great Black, broken and worn 'til her bones were exposed, brings the heart to tears. Yet still, she holds a treasure, unlike anything we have ever uncovered. With this great reverence for spacefarers past, we are compelled to find out what she carried. Our treasure-diggers eagerly stand by, awaiting the order to begin the excavation with bated breath."
 space_shanty_intro_pirate_bio:0 "The drifting remains of an ancient entity have been discovered in the depths of space. Her form is unlike any living vessel we have known. She possesses vast, membranous sails, once capable of unfurling in the cosmic winds, basking in the radiation of distant stars; like a great celestial leviathan gliding on unseen currents. Our linguists have managed to translate only her name; 'Daughter of Kambel'.\n\nNow, she is little more than a withered husk, her frame cracked and exposed, her once-lustrous sails reduced to tattered remnants. Whether this being was engineered, evolved, or something in between remains uncertain. Our treasure-diggers are eager to study her remains, to listen for echoes of her final journey, and perhaps - just perhaps - to learn the song she once sang to the stars."

 ancrel.15021.name.pirate:0 "Familiar, Yet New"
 ancrel.15021.desc.pirate:0 "In a dreamlike daze, our treasure-diggers have explored the decks of the Daughter, every [Owner.Species.GetMouthName] agape with awe. From mast to decks to helm, she's built almost exactly like one of our own world's ancestral sea vessels, but with obviously significant differences of function.\n\nThe interior is sealed and pressurized, and the airlock appears to be intact. The walls bear evidence that parts of its habitation module hosted not an atmosphere, but liquid water. At least some, if not all, of her crew compliment were an aquatic or semi-aquatic species.\n\nWe have found her helm, and her navcomputer appears to be damaged by both the crash as well as millennia of cosmic radiation. Efforts to recover data are underway."

 ancrel.15022.name.pirate:0 "Ballad of Captain Ness"
 ancrel.15022.desc.pirate:1 "With a jolt of life, the console's screen flashes to brightness. The log of the captain names him as Etwyrd Teek. His personal diary accompanies the ship's log, detailing the crew's exploits and tragedies as part of the infamous brotherhood of buccaneers, the Black Needle.\n\nAs we opened Captain Teek's video diaries, the raucous voices of his long-dead crew echoed through the Daughter's hull, lifted in song. Transcription follows:\n\n(Chorus)\n'We'll cast the hawser, set our course\nFor Crew and For Glory!\nWe bare our Flag, show no remorse\nOh free ones, never shall we die!'\n\n'O Needle, pierce the void, and cry\n'For Crew and For Glory!'\nThrough the Black, we devils fly\nOh free ones, never shall we die!\n\n(Chorus repeats)\n\nOh! Charge the guns, grapplers away!\nFor Crew and For Glory!\nWe scuttle their bones, we win the day\nOh free ones, never shall we die!'"

 ancrel.15023.name.pirate:0 "Legendary Pirates"
 ancrel.15023.desc.pirate:1 "The ships' logs describe a long and arduous chase from its home system, spanning nearly two years and cataloguing several skirmishes with a force named only as 'The Vengeance'. Teek's depiction of the pirate hunters is rather colorful, and laced with epithets and oaths.\nThe Vengeance pursued Teek for the destruction and looting of one of their colony vessels, charging him and his crew with the deaths of over 350,000 colonists.\nTeek seemed to show no guilt for his crimes, claiming that the payday had been lucrative and had kept his crew in high spirits for months afterwards.\nMore lyrics to the ancient shanty we have uncovered have also been translated:\n\n(Chorus repeats)\n\n'Oh, Saanda Ness, she's cunning and cold,\nFor Crew and For Glory!\nWhat deeds she did, have oft been told\nOh free ones, never shall she die!'\n\n(Chorus repeats)\n\n'Smeegibb, Horde o' the Stars, they're named\nFor Crew and for Glory!\nDreaded swarm, like a tidal wave\nOh free ones, never shall they die!'"

 ancrel.15024.name.pirate:0 "The Dark Gods' Light"
 ancrel.15024.desc.pirate:1 "Teek's personal diaries are loaded with confessions to ghastly and lurid crimes of conscience. While he was a cruel and ironfisted captain who tolerated no dissent in his crew, he himself secretly conspired with the First Mate to conceal the true extent of the treasure taken from their raids.\nCaptain Teek was embroiled in a scheme to defraud his crew of their due share of the treasure, seemingly for no reason other than he felt the Pirate Code under which his crew sailed denied him an entitled bonus as captain of his own vessel.\nEvidently, his First Mate thought the scheme to be too odious, even for pirates of their standing. In the First Mate's diary, there is evidence that he leaked the captain's greed and conspired with the crew to stage a mutiny.\n\n(Chorus repeats)\n\n' 'Twas a heist o' daring and terror that night\nFor Crew and for Glory!\nStole ourselves the Dark Gods' Light\nOh free ones, never shall we die!'\n\n(Chorus repeats)\n\n'A row on decks, a shot was fired\nFor Crew and for Glory!\nThe cost was the world o' the Ytterites\nOh free ones, never shall they die!'"

 ancrel.15025.name.pirate:0 "The Fate of Saanda Ness"
 ancrel.15025.desc.pirate:1 "Captain Teek anticipated such a double cross, and had concealed several explosive devices throughout the Daughter's masts and rigging. As his crew rose up against him, a blaster bolt pierced his wicked heart. And once his lifeless body had hit the floor, the programmed life-sign sensors embedded in his armor sent the signal and the bombs detonated.\nAs the Daughter lost power to her life support and the ship began to drift into the planet's gravity well, the crew elected to board the escape pods and abandon ship, intending to surrender to the Vengeance.\nAs for the ancient ballad, we have translated all its remainder. Its popularity has spread far and wide through our nation, with our own spacers humming the song in time with their work. Newly inspired in our thirst for adventure, we take to the stars once more!\n\n(Chorus repeats)\n\n'For once in her life, our Queen did mourn,\nFor Crew and for Glory!\nShe cached her gold out 'mongst the moons,\nOh free ones, never shall it die!'\n\n(Chorus repeats)\n\n'Oh Captain Ness, laid down her sword\nHer pride, and her story\nShe cast her body off and swore,\n'Oh free ones, never shall I die.' '"

 ancrel.15022.a:0 "Translate more lyrics."
 ancrel.15023.a:0 "Translate more lyrics!"
 ancrel.15024.a:0 "We want more lyrics!"
 ancrel.15025.a:0 "Memorize the lyrics and set the next course!"

 on_solar_sails_cat:0 "On Solar Sails"
 on_solar_sails_cat_desc:0 "We have found the wreckage of an archaic spaceship with an unusual design. We're not quite sure how its propulsion system works."

 anomaly.7020.name:0 "On Solar Sails"
 anomaly.7020.desc:0 "We have found the wreckage of an archaic spaceship of unusual design. Instead of using propulsion similar to that of modern ships, the craft relied on large sails unfurled in the vacuum of space. Presumably, the ship harvested solar energy and drifted on the solar winds created by starlight."
 anomaly.7020.a:0 "We should dig deeper."
