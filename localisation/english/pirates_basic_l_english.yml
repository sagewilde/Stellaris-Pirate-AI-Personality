# AUTHORITIES - Corporate
# Synth Corporate Physical
 RT_FLEET_OVERSEER: "Fleet Overseer"
 auth_synth_corporate_physical_pirate: "Pirate Sapience"
 auth_synth_corporate_physical_pirate_desc: "Labor on a ship is far easier to keep when they have no need for food, sleep, or even living quarters. With the need for physical wants irrelevant, and the capacity to assimilate directly into a vessel's main computer, this synthetic empire commands the most dangerous navy in the galaxy; a part of the ship, a part of the crew."

 concept_auth_synth_corporate_physical_pirate: "$auth_synth_corporate_physical_pirate$"
 gov_synth_corporate_physical_pirate: "$auth_bio_corporate_purity_pirate$"
 gov_synth_corporate_physical_pirate_desc: "$auth_synth_corporate_physical_pirate_desc$"

# Synth Corporate Virtual
 RT_ELITE_HACKER: "1337_H4XX0R"
 auth_synth_corporate_virtual_pirate: "Net-Pirate Hack-ocracy"
 auth_synth_corporate_virtual_pirate_desc: "The key to the treasure of the future isn't in safecracking or explosives, but in decryption; gathering information and secrets. The most dangerous pirates aren't the ones that can shoot down your ships, they're the ones that can turn your own starbase against you with an executed command. Why? 4 teh lulz, obv."

 concept_auth_synth_corporate_virtual_pirate: "$auth_synth_corporate_virtual_pirate$"
 gov_synth_corporate_virtual_pirate: "$auth_synth_corporate_virtual_pirate$"
 gov_synth_corporate_virtual_pirate_desc: "$auth_synth_corporate_virtual_pirate_desc$"

# Cyber Corporate Collectivist
 auth_cyber_corporate_collectivist_pirate: "Privateer Cyber-Union"
 auth_cyber_corporate_collectivist_pirate_desc: "With cybernetic enhancements ensuring perfect coordination and instantaneous communication on their vessels, the chain of command is seamless and unbreakable.\n\nBut with so many enemies seeking power, it is remarkably easy to simply shut down the captain's brain with a well-packaged virus. Mutiny, too, has evolved as we have."

 gov_cyber_corporate_collectivist_pirate: "$auth_cyber_corporate_collectivist_pirate$"
 gov_cyber_corporate_collectivist_pirate_desc: "$auth_cyber_corporate_collectivist_pirate_desc$"
 concept_auth_cyber_corporate_collectivist_pirate: "$auth_cyber_corporate_collectivist_pirate$"

# Cyber Corporate Individualist
 auth_cyber_corporate_individualist_pirate: "Wetwork Wire-ates"
 auth_cyber_corporate_individualist_pirate_desc: "A pirate makes his own fate. With bionic weapons and replaceable limbs, every hand on deck is both unique and equally powerful.\n\nWith this vast renegotiation of power comes a new swath of tools that captains must use to maintain order on their vessels. Some may call it hacking. Others may call it statecraft. This has lead to a malware arms' race to maintain political control."
 gov_cyber_corporate_individualist_pirate: "$auth_cyber_corporate_individualist_pirate$"
 gov_cyber_corporate_individualist_pirate_desc: "$auth_cyber_corporate_individualist_pirate_desc$"
 concept_auth_cyber_corporate_individualist_pirate: "$auth_cyber_corporate_individualist_pirate$"

# Bio Purity
 auth_bio_corporate_purity_pirate: "Bio-Buccaneer Syndicate"
 auth_bio_corporate_purity_pirate_desc: "These pirates have stolen the very secret to life itself. Capable of stealing organs and ransoming them back to their still-living owners, these ransomeers will hold your very own heart hostage if it means they can bleed you dry for every credit. Those who cannot afford the ransom rarely live long enough to seek revenge."

 concept_bio_corporate_purity_pirate: "$auth_bio_corporate_purity_pirate$"
 gov_bio_corporate_purity_pirate: "$auth_bio_corporate_purity_pirate$"
 gov_bio_corporate_purity_pirate_desc: "$auth_bio_corporate_purity_pirate_desc$"

# Bio Cloning
 auth_bio_corporate_cloning_pirate: "Corsair Cloners"
 auth_bio_corporate_cloning_pirate_desc: "The limits of a ship are dictated by the limits of her crew. So what can one do when the cunning and craft of an organic being is married with the easy replicability of a machine? The result is a navy that is never short of fit, healthy spacers; an insurmountable raiding force, winning through sheer numbers."

 concept_bio_corporate_cloning_pirate: "$auth_bio_corporate_cloning_pirate$"
 gov_bio_corporate_cloning_pirate: "$auth_bio_corporate_cloning_pirate$"
 gov_bio_corporate_cloning_pirate_desc: "$auth_bio_corporate_cloning_pirate_desc$"

# Bio Mutation
 auth_bio_corporate_mutation_pirate: "Aberrant Rogues"
 auth_bio_corporate_mutation_pirate_desc: "There are few things more dangerous than a criminal that you can never catch. With mutant powers capable of shapeshifting, blasting walls, and even surviving the vacuum of space, these pirates are as diverse as they are deadly."

 concept_bio_corporate_mutation_pirate: "$auth_bio_corporate_mutation_pirate$"
 gov_bio_corporate_mutation_pirate: "$auth_bio_corporate_mutation_pirate$"
 gov_bio_corporate_mutation_pirate_desc: "$auth_bio_corporate_mutation_pirate_desc$"

# EvoPred Pirates
 auth_bio_corporate_evopred_pirate: "DNA Freebooters"
 auth_bio_corporate_evopred_pirate_desc: "The ill-gotten gains these pirates seek aren't anything that their victims carry in their pockets, but in their bodies. With an enormous wealth of genetic material, this pirate syndicate can adapt to, very literally, anything that their enemies may invent to ensnare them." 

 concept_bio_corporate_evopred_pirate: "$auth_bio_corporate_evopred_pirate$"
 gov_bio_corporate_evopred_pirate: "$auth_bio_corporate_evopred_pirate$"
 gov_bio_corporate_evopred_pirate_desc: "$auth_bio_corporate_evopred_pirate_desc$"

# Shroud Transcendant
 auth_shroud_corporate_transcendant_pirate: "Mindscape Marauders"
 auth_shroud_corporate_transcendant_pirate_desc: "These pirates haven't had an original thought in ages, because they've stolen all of yours. This pirate syndicate has little interest in taking your ship. They are capable of slipping into a populace and stealing military secrets, political blackmail, and personal passwords.\n\nYou will give your ship to them - and anything else they want - because you will not have a choice."

 concept_shroud_corporate_transcendant_pirate: "$auth_shroud_corporate_transcendant_pirate$"
 gov_shroud_corporate_transcendant_pirate: "$auth_shroud_corporate_transcendant_pirate$"
 gov_shroud_corporate_transcendant_pirate_desc: "$auth_shroud_corporate_transcendant_pirate_desc$"

# Shroud Corporeal
 auth_shroud_corporate_corporeal_pirate: "Telekinetic Kleptocracy"
 auth_shroud_corporate_corporeal_pirate_desc: "No prison can hold these criminals. When the ability to rip open a bank vault at twenty paces is commonplace, what can possibly stop these pirates from taking what they want, when they want?\n\nWith the ability to make their will manifest, psi-pirates are more capable than ever of building - or breaking - whatever their twisted hearts desire."

 concept_shroud_corporate_corporeal_pirate: "$auth_shroud_corporate_corporeal_pirate$"
 gov_shroud_corporate_corporeal_pirate: "$auth_shroud_corporate_corporeal_pirate$"
 gov_shroud_corporate_corporeal_pirate_desc: "$auth_shroud_corporate_corporeal_pirate_desc$"