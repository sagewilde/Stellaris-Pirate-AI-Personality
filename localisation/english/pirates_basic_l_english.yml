 ### Jobs and Job Descriptions
 job_commandante_pirate:0 "Pirate Admiral"
 job_commandante_pirate_plural:0 "Pirate Admirals"
 job_commandante_pirate_desc:0 "In a wretched hive of scum and villainy, it pays to be the one that makes pirates cower. Pirates are violent, bloodthirsty, and cruel. They only understand power, and these master tacticians are fluent in the language of bloodshed. Fear keeps them in line, on-planet and in space."
 job_noble_commandante_pirate:0 "Pirate Lord-Commandante"
 job_noble_commandante_pirate_plural:0 "Pirate Lords-Commandante"
 job_noble_commandante_pirate_desc:0 "This stellar kleptocracy prizes family lines derived from the most feared pirate captains in galactic history. Sculpted into icons of power and bloody wealth from birth, these pirate nobles put a whole new, dreadful meaning behind 'Robber Barons'."
 job_pirate_combat_instructor:0 "Pirate Combat Instructor"
 job_pirate_combat_instructor_plural:0 "Pirate Combat Instructors"
 job_pirate_combat_instructor_desc:0 "A sharp mind is a valuable asset to every privateer fleet. Focusing on development instead of punishment not only enables pirates to make their own fate, it stops shipboard conflict before it can even arise--a deeply vital necessity on years-long voyages. After all, there's only so much room in the brig, and every hand brings the payday closer."
 job_steward_captains:0 "Steward Captain"
 job_steward_captains_plural:0 "Steward Captain"
 job_steward_captains_desc:0 "As a loose confederation of cooperative fleets, the charter under which a pirate captain may fly our flag requires on-planet duties as well as in space. From our foes, we take all that they have hoarded by their greed. And to each pirate, a fair share of the loot!"
 job_shanty_singer:0 "Shanty Singer"
 job_shanty_singer_plural:0 "Shanty Singers"
 job_shanty_singer_desc:0 "These entertainers are veritable encyclopedias of naval lore, and know hundreds of songs that synchronize tasks and improve morale. Some shanties are modernized renditions of ancient seafaring ballads of their ancestral homeworlds, creating a sense of continuity in their people's traditions."
 job_duelist_shanty_singer:0 "Tavern Storyteller"
 job_duelist_shanty_singer_plural:0 "Tavern Storytellers"
 job_duelist_shanty_singer_desc:0 "These old sailors, suffering injuries of the body or mind too severe to return to the Great Black, remain on planet to tell dread tales of leviathans and devourers. The young are callow and hopeful; better to show them reality before they get in too far over their heads. And to those who doubt their warnings, they will prove why it is so rare to see an old pirate."

 ### Space Shanty Intro - Pirate
 space_shanty_intro_pirate:0 "It's like something out of a childhood dream. A vast, beautiful wood and ceramo-metallo alloy ship. Like a hybrid between the most graceful bird and the most regal planetbound sea vessel, she's shaped as if she was raptured from the surface of an ocean world and set to glide in the Great Black. Her long photovoltaic sails shimmer with gold, as if the sunlight she caught in eons past is still there in the hyperglass fibers. Our linguists have managed to translate only her name; 'Daughter of Kambell'. This beautiful queen of the Black, broken and worn 'til her bones were exposed, brings the heart to tears. Yet still, she holds a treasure, unlike anything we have ever uncovered. With this great reverence for spacefarers past, we are compelled to find out what she carried. Our treasure-diggers eagerly stand by, awaiting the order to begin the excavation with bated breath."
 
 ### Slightly tweaked, for humor and flavor. -- SageWilde
 
