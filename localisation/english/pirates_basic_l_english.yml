### AI Personalities
 personality_mirthful_bandits:0 "Mirthful Bandits"
 personality_mirthful_bandits_desc:0 "'Rob the rich to feed the poor' is the mirthful bandit's credo. Defiant and mischievous, this star nation has chosen to pursue piracy as a path to redistributing wealth to the less advantaged peoples of their nation, as well as others. They do so with a smart remark and a quick blaster, but are just as eager to make friends as they are to make enemies."

 personality_cunning_raiders:0 "Cunning Raiders"
 personality_cunning_raiders_desc:0 "The worst has come. The barbaric raiders that prowl outside the border have come under the lash of a merciless pirate lord, uniting them into a dreadful and terrifying force. They have set their sights on pillaging, plundering, and taking whatever they may want, for any reason they may invent. The hyperlanes may never be safe again as long as their ships fly the void."

### Prescripted Empire - Free Fleets of Lore
 EMPIRE_DESIGN_lore_spacers:0 "Free Fleets of Lore"
 PRESCRIPTED_adjective_lore_spacers:0 "Lore Spacers"
 PRESCRIPTED_lore_spacers:0 "FV"
 PRESCRIPTED_species_name_lore_spacers:0 "Exceed"
 PRESCRIPTED_species_plural_lore_spacers:0 "Exceeds"
 PRESCRIPTED_species_adjective_lore_spacers:0 "Exceed"
 PRESCRIPTED_species_bio_lore_spacers:0 "Land on Lore is a rare, and precious resource. For centuries, the Exceeds fought viciously over the few patches of dry ground the planet had. This led to concentrated trade routes that were frequently attacked by pirates. As these pirates rose to political power, they began to slowly disassemble old rivalries and unite with a common goal; the safety and prosperity of their pirate havens. Finally united, they eagerly take to the stars, bringing with them over a millennium of seafaring culture."
 PRESCRIPTED_planet_name_lore_spacers:0 "Lore"
 PRESCRIPTED_system_name_lore_spacers:0 "Myth"
 PRESCRIPTED_ruler_name_lore_spacers:0 "Phanta Sharp"
 PRESCRIPTED_ruler_bio_lore_spacers:0 "Captain Sharp is more than a cunning commander; she is a wily politician, an enthusiastic explorer, and a gleeful troublemaker."
 START_SCREEN_FFL:0 "Article 1 - A pirate makes his own fate. None can choose it for him, and only the wind and tides may sway him from it.\nArticle 2 - The captain is chosen by the crew. Should the captain be unable or unfit in his duties, then he is removed by any means.\nArticle 3 - The spoils of our take are first spent to keep the ship, then to keep the havens, then equally amongst us all. None may take a greater share, on pain of death.\nArticle 4 - Never shall we oppress others as we were once oppressed, and always shall we be liberators of the weak and thorns in the sides of the greedy. This must never be forgotten.\n\nIn our ancient past, the Exceed race violently squabbled over the few scraps of land we had on our watery ocean world. Across the archipelagos of islands, pirate lords ruled like tyrants, wielding their navies with impunity. Those few who dared to cross the vast and unforgiving seas were limited to narrow sea lanes where fresh water was available, making encounters with these greedy predators inevitable. Slavery, exploitation, and other horrors abounded, and the people bent under the weight of despair.\n\nThen, one day, a miracle happened. A band of newly-taken captives in the hull of a slaver ship forged a pact; the first Pirate Code. Together, they rose from belowdecks, slaughtered their captors, and took the ship as their own prize. They began sailing the seas, stealing from those who had stolen from the weak, and liberating ports and towns that had once been chained.\n\nIn the following centuries, these new havens shared their seas under a common promise; that never again would tyrants rule them.\n\nAs the Free Fleets of Lore turned their helms to the stars and built the first starships, they have vowed to keep this sacred oath. There would be honor among thieves in this nation of pirates."

