# AUTHORITIES - Corporate
# Synth Corporate Physical
 RT_FLEET_OVERSEER:0 "Fleet Overseer"
 auth_synth_corporate_physical_pirate:0 "Pirate Sapience"
 auth_synth_corporate_physical_pirate_desc:0 "Labor on a ship is far easier to keep when they have no need for food, sleep, or even living quarters. With the need for physical wants irrelevant, and the capacity to assimilate directly into a vessel's main computer, this synthetic empire commands the most dangerous navy in the galaxy; a part of the ship, a part of the crew."

