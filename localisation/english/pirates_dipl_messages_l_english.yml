l_english:
 CORP_PE_HOSTILE_GREETING_01:0 "We have no intention of taking your dirty wares, [From.GetSpeciesNamePlural]. We don't do business with bloody pirates!"
 CORP_PE_HOSTILE_GREETING_02:0 "Your business model is an existential threat to our own. And the board of directors at [Root.GetName] takes those sorts of threats personally."
 TO_PE_HOSTILE_GREETING_01:0 "It is the duty of all civilized nations to stamp out the barbaric practice of piracy. Your days are numbered, [From.GetAdj] scum!"
 TO_PE_HOSTILE_GREETING_02:0 "Your violent and cutthroat way of life is a threat to all of us. You're unfit to call yourselves a civilized people. You're nothing but common thugs!"
 TO_PE_HOSTILE_GREETING_03:0 "We don't negotiate with pirates. Not unless you're offering to turn yourselves in!"
 TO_PE_GREETING_HOSTILE_EG_01:0 "We have a duty to end the slave trade in the galaxy. And that means rooting out its main supplier; filthy pirates like you!"
 CORP_PE_NEUTRAL_GREETING_01:0 "Pirates, eh? You wouldn't happen to have vessels for hire, would you? If we play our cards right, we could both make a king's ransom."
 TO_PE_NEUTRAL_GREETING_01:0 "Privateering activities in [Root.GetAdj] space must be registered with the border guard, or otherwise sanctioned by the [Root.GetRulerTitle]. Cross us, and we will open fire on your vessels."
 TO_PE_NEUTRAL_GREETING_02:0 "As [Root.GetAdj] law dictates, acts of piracy committed in the [Root.GetName] are punishable by the seizure of the offending vessel, its assets, and its crew. Don't test us, [From.GetSpeciesNamePlural]"
 TO_PE_NEUTRAL_GREETING_03:0 "The notion that individuals prey on other individuals, like cuthuloids lurking in asteroid belts, is a deviant idea. Do not have such ideas about the [Root.GetName], and you may be spared our wrath."
 TO_PE_THREATENED_GREETING_01:0 "We are prepared to parley with your [From.GetRulerTitle]. Surely we can pay a reasonable tribute instead?"
 CORP_PE_FRIENDLY_GREETING_01:0 "What's a little leveraged privateering between friends, after all? As long as our ships make it from point A to point B, we turn a profit."
 TO_PE_FRIENDLY_GREETING_01:0 "Ahoy, er, [From.GetRulerTitle] [From.GetRulerName]. How be the, er, plunder and parley today?"
 TO_PE_FRIENDLY_GREETING_02:0 "It is a pleasure to have the company of such competent soldiers of fortune. A weight off all our minds, to be sure, knowing that you're on our side."
 TO_PE_FRIENDLY_GREETING_03:0 "Speak, noble pirate. The [Root.GetName] is listening."
 TO_PE_WAR_GREETING_01:0 "Your days of plundering and pillaging are over, pirate scum!"
 TO_PE_WAR_GREETING_02:0 "For every civilian [Root.GetAdj] vessel you [From.GetSpeciesNamePluralInsult] have taken from us, the [Root.GetName] will take ten of yours!"
 TO_PE_WAR_GREETING_03:0 "Turn yourselves in, and the [Root.GetAdj] courts might be convinced to grant you life in prison instead of execution."
 TO_PE_WAR_GREETING_EG_01:0 "Justice will not rest as long as [From.GetAdj] slave ships are kidnapping innocent xenos and selling them like cattle! Your reign of terror over the void ends now!"
 TO_PE_OVERLORD_GREETING_01:0 "It is admittedly quite a boon to have privateers on retainer. Our trade routes have never been safer, now that you're under our navy's control."
 TO_PE_VASSAL_GREETING_01:0 "Good day to you, [From.GetRulerTitle] [From.GetRulerName]. We trust that our tribute this month is to your crew's satisfaction?"
 TO_PE_VASSAL_GREETING_DISLOYAL_01:0 "There is a word for how we feel towards your leadership, [From.GetSpeciesNamePlural]. 'Mutinous.'"
 TO_PE_VASSAL_DOMINEERING_01:0 "The golden age of piracy is at an end, [From.GetSpeciesNamePlural]. It's only a matter of time before the last [From.GetAdj] flag has flown its colors."

 PE_HOSTILE_GREETING_01:0 "You're playing a dangerous game, parleying with us, [From.GetRulerTitle]. Our patience is wearing thin."
 PE_HOSTILE_GREETING_02:0 "Our good graces only extend so far, [From.GetSpeciesNamePlural]. They extend about as far as the closest airlock."
 PE_PE_HOSTILE_GREETING_01:0 "If there's one thing the crew of the [Root.GetName] hates more than anything, even pirate-hunters, it's competition."
 PE_PE_HOSTILE_GREETING_02:0 "The difference between us, [From.GetSpeciesNamePluralInsult], is that we're bloody good at what we do. You're not fit to call yourselves part of our brotherhood."
 PE_NEUTRAL_GREETING_01:0 "As long as your vessels pay the appropriate tribute when they enter our space, we won't have any problems."
 PE_NEUTRAL_GREETING_02:0 "We are the [Root.GetName]. If our prey puts up a fight, we give no quarter. Think of that if your ship sees our flag. You're better off not fighting."
 PE_PE_NEUTRAL_GREETING_01:0 "You share our creed, [From.GetSpeciesNamePlural]? Hmph. We'll see if you're worthy of calling yourselves pirates."
 PE_PE_NEUTRAL_GREETING_02:0 "You mind your hunting grounds, and we'll mind ours, [From.GetSpeciesNamePlural]. Don't poach on our turf unless you want to lose at least one [From.GetEyeName]."
 PE_FRIENDLY_GREETING_01:0 "Your ships are among the rare few who can travel in [Root.GetAdj] space without fear. Do not take that privilege for granted."
 PE_FRIENDLY_GREETING_02:0 "The [Root.GetName] finds its membership in the [Root.GetAllianceName] advantageous. As long as you continue to contribute to the federation navy, that is. If you want more from us, you'll have to hire us properly."
 PE_PE_FRIENDLY_GREETING_01:0 "Yar har, fiddle-dee-dee, being a pirate is alright with me! Do what you want, 'cos a pirate is free, you arrrr a pirate! Sing it with me!"
 PE_WAR_GREETING_01:0 "We prefer it if your ships surrender. We hate to damage good merchandise."
 PE_WAR_GREETING_02:0 "Do you know what we do with [From.GetAdj] captains aboard the vessels we take? I'll give you a hint. They take a breezy walk from a short airlock."
 PE_WAR_GREETING_03:0 "Don't take it so hard, [From.GetSpeciesNamePlural]. After all, you know what a hostile takeover is. For us, it's just business. Bloody, bloody business."
 PE_PE_WAR_GREETING_01:0 "If you even THINK the word 'parley', I'll have your guts for garters!"
 PE_VASSAL_GREETING_01:0 "Ahoy, Captain [From.GetRulerName]. What's our heading today?"
 PE_VASSAL_GREETING_DISLOYAL_01:0 "Careful with where you step, [From.GetSpeciesNamePlural]. You can only buy the loyalty of pirates for so long before they begin to think of mutiny."
 PE_VASSAL_DOMINEERING_01:0 "Your personal shuttle would be a fine prize for the [Root.GetRulerTitle], [From.GetRulerName]. A fine prize indeed."