l_english:
 ### Mirthful Bandits - Friendly
 ### 'Root' is self, 'From' is the sender. Switches with insults, for some ungodly reason.
 MB_FRIENDLY_GREETING_01:0 "A slight warning to you. Avoid these systems for the next few days or so. Just trust us, don't go there. We're conducting, ah, a charity drive soon. Unless, of course, you'd care to donate to a worthy cause..."
 MB_FRIENDLY_GREETING_02:0 "The [From.GetName] and the [Root.GetName], partners in cri--er, international diplomacy. It's good to see you. What can we do for you?"
 MB_FRIENDLY_GREETING_03:0 "Thank you for helping us resettle those refugees. We're still making sure that potential locations are good fits for new immigrants, and the pirate's life isn't for everyone. Did you want to discuss our migration treaty, or something else?"
 MB_FRIENDLY_GREETING_04:0 "Welcome in, mate! Sit down, share a bottle of *very* potent potables with me. Let's talk business."
 MB_FRIENDLY_GREETING_05:0 "The havens are full of new opportunities for new crews, each eager to make their mark on the Great Black. Thanks to our friendship, they're fuller than ever."
 MB_FRIENDLY_GREETING_CORP_01:0 "[From.GetLeaderName], welcome. I trust that our current trade agreements are still suitable for your needs? Or were you looking to hire a fleet from us? We don't come cheap, but we are excellent at what we do."
 MB_FRIENDLY_GREETING_CORP_01:0 "Hm? A missing merchant vessel? Sorry, mate. Trust me, you'd be the first one to know if it was on my orders. Obviously, I can't make promises for unsanctioned raids..."
 MB_FRIENDLY_GREETING_HM_01:0 "The instinctive and cohesive communication of your drones is admirable. On our vessels, we've developed 'space shanties' that synchronize such work. Amazing that you do it naturally. May I ask... do *you* sing?"
 MB_FRIENDLY_GREETING_MECH_01:0 ""
 MB_FRIENDLY_GREETING_PAC_01:0 "Speaking strictly as your friendly expert on the matter, I strongly suggest building out your navy. While our treaties may prohibit official attacks on your vessels, we can't control every pirate in the galaxy--it's impossible to try. Consider sending a small escort of corvettes with your science ships."
 MB_FRIENDLY_GREETING_MIL_01:0 ""
 MB_FRIENDLY_GREETING_EGL_01:0 "Are you familiar with 'hydrarchy'? On our ancestral worlds, our oppressors were thoroughly shocked and surprised that we not only mutinied on their ships, but took them for our own and governed ourselves. Freebooters have long been incubators of democracy, believe it or not."
 MB_FRIENDLY_GREETING_MAT_01:0 "While piracy began with taking merchant vessels on the high seas, its evolution in the realm of knowledge and technology is merely a natural extension of our thirst for treasure. What greater treasure is there than knowledge? What greater gift to the galaxy than making it free?"
 MB_FRIENDLY_GREETING_SPR_01:0 "Our shanty-singers were wondering if we could host an exchange program with your priests. Your choral music is absolutely haunting. It's all the rage on [Root.Capital.GetName], and we're looking to adapt some of our shanties for planet-ward performances."
 MB_FRIENDLY_GREETING_XPL_01:0 ""
 MB_FRIENDLY_GREETING_SOC_01:0 ""
 MB_FRIENDLY_GREETING_ECO_01:0 ""
 MB_FRIENDLY_GREETING_IND_01:0 ""

 # Mirthful Bandits - Neutral
 MB_NEUTRAL_GREETING_01:0 "'Rob?' Tsk, tsk, tsk. That's a naughty word, we *never* rob. We just borrow a bit from those as can afford it, that's all."
 MB_NEUTRAL_GREETING_02:0 "We're an independent coalition of fleets. But if you have need of an escort for particularly... 'sensitive' shipments, we can be both flexible and discreet, so long as we're well paid."
 MB_NEUTRAL_GREETING_03:0 "It seems like your hyperlanes are a little lightly guarded. Very very dangerous, you know. If you're looking for assistance there, we happen to have a fleet available for rent."
 MB_NEUTRAL_GREETING_04:0 "We're not interested in dealing with you. But trust us, this won't be the last time we discuss business. Not by a long shot."
 MB_NEUTRAL_GREETING_05:0 "Now, please, don't be afraid to say the 'p' word. 'Piracy' isn't a filthy word, it's a difficult and noble vocation. But if you prefer, we'll also answer to 'privateer', 'freebooter' and 'corsair'."
