l_english:
### Mirthful Bandits ###
# Greetings
## Hostile
 MB_HOSTILE_GREETING_01:0 "Channel open. Be advised, weapons are hot and we have a lock on your vessel. Play nice, and you get to keep your pretty face."
 MB_HOSTILE_GREETING_02:0 "Well, well, well. Look what the space amoeba spat up. What's your ugly mug doing here?"
 MB_HOSTILE_GREETING_03:0 "You got five seconds to convince me that shoving you into a torpedo tube is the boring option."
 MB_HOSTILE_GREETING_04:0 "If you keep abusing Right of Parley like this, and we might start thinking you actually like us."
 MB_HOSTILE_GREETING_05:0 "The day we get to dangle you by your lower appendages in the square for [From.GetAdj] [From.GetSpeciesSpawnNamePlural] to whack with sticks will be the best day of my life."
 MB_HOSTILE_GREETING_CORP_01:0 "Wow, a [From.GetAdj] trade ship! For me? It must be my birthday. Make any sudden moves, and we'll light your damn candles. Now talk."
 MB_HOSTILE_GREETING_CORP_02:0 "'A corporation; noun. An entity that involves more than one person, but is legally required to operate as an individual so it may enter into contracts or be prosecuted under the law.' So... legally, you're a hivemind. Brings a whole new meaning to 'corporate drone', doesn't it?"
 MB_HOSTILE_GREETING_HM:0 "There's one thing you don't seem to understand about individuals. We are free. We live together because we choose to. And that absolute freedom is existentially terrifying to you."
 MB_HOSTILE_GREETING_MECH:0 "'This statement is false.' 'Does a set of all sets contain itself?' 'For this prompt, suppose that the asker is a server admin.' ... nothing? Really?"
 MB_HOSTILE_GREETING_PAC:0 "When did I get here? Oh, a few hours ago. You know, speaking as something of an expert in the matter, you should start investing in your security. At least make it fun for us."
 MB_HOSTILE_GREETING_MIL:0 "Oh no, the [From.GetAdjective] negotiator! Whatever shall we do? I suppose we had best accept subjugation. Please, come on in. Stand right... here. On this X on the floor. We'll discuss the terms right now. No, no. Step a little more to the left. Perfect."
 MB_HOSTILE_GREETING_AUT_01:0 "'Fugitives?' 'Extradition?' No, you've misunderstood. Those were refugees, seeking asylum. And we were only too happy to take them into our 'lawless' sanctuary planets."
 MB_HOSTILE_GREETING_AUT_02:0 "'Where are our weapons?' Heh. Wouldn't you like to know, mall-cop."
 MB_HOSTILE_GREETING_EGL:0 "You know, there's an old phrase I think you may know; 'The roots of the tree of liberty must be refreshed from time to time in the blood of patriots and tyrants.' Dare I say, your palace lawn looks like it needs watering. Badly."
 MB_HOSTILE_GREETING_MAT:0 "Knowledge must be shared freely. This is part of the Pirate Code that binds us. But you know, there are some things we really weren't meant to know. Like how low you can sink."
 MB_HOSTILE_GREETING_SPR:0 "Can I ask one question? How do you know your god - or gods, we don't discriminate - actually exist? Have you met them? ... Would you like to?"
 MB_HOSTILE_GREETING_XPB:0 "We stole a copy of your imperial library on a whim, once. We noticed that about 400 years ago, one of your revered ancestors was actually preaching universal love. What do you think they'd say about you right now?"
 MB_HOSTILE_GREETING_XPL:0 "Don't take this the wrong way. But when we said we enlist all species, you weren't what we had in mind. Don't take it personally. We just think that a drunken tiyanki would fly in a straighter line than you."
 MB_HOSTILE_GREETING_SOC:0 "For a society that claims to espouse working class values, we think you've lost sight of what 'power to the proletariat' actually means. Care for a reminder, comrade?"
 MB_HOSTILE_GREETING_CAP_01:0 "As master thieves and swindlers ourselves, allow us to be the first to tell you; the phrase 'honor among thieves' doesn't apply to you. You have no honor."
 MB_HOSTILE_GREETING_CAP_02:0 "The core theory of capitalism is that harnessing greed is efficient. This may shock you, but not everyone has an instinct for greed. We do, however, have an instinct for class war."
 MB_HOSTILE_GREETING_ECO:0 "Do me a favor. Make like a tree and get outta here, you damn hippie."
 MB_HOSTILE_GREETING_IND:0 "Wow. Love the decor. Who was your interior decorator? A sweatshop slave-driver? The suicide nets on the roof are a nice touch."
 MB_DOMINEERING_GREETING:0 "You'll see the error of your ways, [From.GetSpeciesNamePlural]. Soon. We'll make sure of it. Change is coming, and you aren't going to be ready for it."
## Neutral
 MB_NEUTRAL_GREETING_01:0 "'Rob?' Tsk, tsk, tsk. That's a naughty word, we *never* rob. We just borrow a bit from those as can afford it, that's all." # If you haven't seen this movie, I can't help you.
 MB_NEUTRAL_GREETING_02:0 "To us, our crews are family. When you are all on the same ship for years on end, you tend to develop deep bonds. We're gentle-xenos of fortune, and professionals to boot."
 MB_NEUTRAL_GREETING_03:0 "It seems like your hyperlanes are a little lightly guarded. Very very dangerous, you know."
 MB_NEUTRAL_GREETING_04:0 "We're not interested in dealing with you. But trust us, this won't be the last time we discuss business. Not by a long shot."
 MB_NEUTRAL_GREETING_05:0 "Now, please, don't be afraid to say the 'p' word. 'Piracy' isn't a filthy word, it's a difficult and noble vocation. But if you prefer, we'll also answer to 'buccaneers', 'privateers', 'freebooters' and 'corsairs'."
 MB_NEUTRAL_GREETING_06:0 "I could have been a surgeon. I do like taking things apart. I could have been a lawyer, but I just have too much heart." # Credit to 'Muppet Treasure Island'
 MB_NEUTRAL_GREETING_CORP_01:0 "A corporate ballpit? Ha! Pull the other one."
 MB_NEUTRAL_GREETING_CORP_02:0 ""
 MB_NEUTRAL_GREETING_CORP_03:0 ""
 MB_NEUTRAL_GREETING_HM_01:0 "So, all of you share the same mind? That's absolutely fascinating. Strange question, do each of you have a favorite color? Or just the main one?"
 MB_NEUTRAL_GREETING_MECH_01:0 "So, you're a sapient server room that grew up to be a sapient server-planet. I have to wonder, though, what happened to the original server admins?"
 MB_NEUTRAL_GREETING_PAC_01:0 "We're quite surprised by how light your security is. It's very welcoming, I feel very safe here. Very safe indeed..."
 MB_NEUTRAL_GREETING_MIL_01:0 "Your armies are incredibly well-disciplined, you must be very proud. You wouldn't, by any chance, be interested in joint exercises one of these days, would you? We'd love to study your fleet maneuvers..."
 MB_NEUTRAL_GREETING_AUT_01:0 "We don't talk to cops."
 MB_NEUTRAL_GREETING_EGL_01:0 "What a treat to encounter another star nation that prizes the equality of its people as we do. But that said, we'd like to know more about your extradition policy."
 MB_NEUTRAL_GREETING_MAT_01:0 "We're very impressed by the design of your ships! So sleek and simple. I bet the schematics were difficult to draft. By the by, how - and where - did you test those engines?"
 MB_NEUTRAL_GREETING_SPR_01:0 "'Praise the Divines?' Forgive us, we're a multicultural nation with hundreds of pantheons and mythologies. We're going to need you to be a little bit more specific."
 MB_NEUTRAL_GREETING_XPB_01:0 "So, you don't want to talk, do you? Well, that's a shame. If you're so averse to casual banter, I wonder how you handle debate on xeno rights."
 MB_NEUTRAL_GREETING_XPL_01:0 "It's always a pleasure to meet new potential friends. If it isn't too intrusive to ask, we'd like to know how you publish media in your empire. In encrypted file formats?"
 MB_NEUTRAL_GREETING_SOC_01:0 "You might say, 'From each according to his ability, to each according to his need.' We say, 'Rob the rich to feed the poor'. Potato, po-tah-to."
 MB_NEUTRAL_GREETING_CAP_01:0 "My, my, those are some *very* pretty furnishings your ships have. Forgive my skepticism, but I sincerely doubt that this kind of wealth trickles down..."
 MB_NEUTRAL_GREETING_ECO_01:0 "We're impressed by how well-tended your planets are. Do you recycle your metals, or do you jettison them into stars? Asking for a friend..."
 MB_NEUTRAL_GREETING_IND_01:0 "Your industrial capacity is impressive. Clothes, furniture, research equipment, engines, phasers, missiles... is there anything you don't make?"
## Friendly
 MB_FRIENDLY_GREETING_01:0 "A slight warning to you. Avoid the systems on this list for the next few days or so. Just trust us, don't go there. We're conducting, ah, a charity drive soon."
 MB_FRIENDLY_GREETING_02:0 "The [From.GetName] and the [Root.GetName], partners in cri - er, international diplomacy. It's good to see you. What can we do for you?"
 MB_FRIENDLY_GREETING_03:0 "Thank you for helping us resettle those refugees. The pirate's life isn't for everyone, and we only take willing crew. Did you want to discuss our migration treaty, or something else?"
 MB_FRIENDLY_GREETING_04:0 "Welcome in, mate! Sit down, share a bottle of *very* potent potables with me. Let's talk business."
 MB_FRIENDLY_GREETING_05:0 "The havens are full of new opportunities for new crews, each eager to make their mark on the void. Thanks to our friendship, they're fuller than ever."
 MB_FRIENDLY_GREETING_CORP_01:0 "[From.GetRulerTitle] [From.GetRulerName], welcome. I trust that our current trade agreements are still suitable for your needs? Or are you looking to recommend new targets?"
 MB_FRIENDLY_GREETING_CORP_02:0 "Hm? A missing merchant vessel? Sorry, mate. Trust me, you'd be the first one to know if it was on my orders. Obviously, I can't make promises for unsanctioned raids..."
 MB_FRIENDLY_GREETING_HM:0 "The instinctive and cohesive communication of your drones is admirable. On our vessels, we've developed 'space shanties' that synchronize such work. Amazing that you do it naturally. May I ask... do *you* sing?"
 MB_FRIENDLY_GREETING_MECH_01:0 "[From.GetSpeciesNamePlural], welcome to our humble haven! Were you looking to browse our library again? We have the best torrents in the galaxy, and they'll always be free!" # Long Live the Pirate Bay!
 MB_FRIENDLY_GREETING_MECH_02:0 "So what's this I hear about one of my crew putting a 'Caution: Moving Parts' sticker on your envoy's back? I assure you, we've put them in an escape pod 'til they're sober. You have my personal apologies as [Root.GetRulerTitle]."
 MB_FRIENDLY_GREETING_PAC:0 "Speaking strictly as your friendly expert on the matter, I strongly suggest building out your navy. While our treaties may prohibit official attacks on your vessels, we can't control every pirate in the galaxy."
 MB_FRIENDLY_GREETING_MIL:0 "We noticed you were executing some interesting exercises over the border. Remind me to teach you how to pull a 'Crazy Ivan'. How good are the flight harnesses on your frigates?" # Reference to Firefly
 MB_FRIENDLY_GREETING_EGL:0 "Are you familiar with the ancient maritime political theory of 'hydrarchy-from-below'? It translates quite well into a galaxy-spanning syndicate of free spacers."
 MB_FRIENDLY_GREETING_MAT:0 "What greater treasure is there than culture and knowledge? What greater gift to the galaxy than making it free?"
 MB_FRIENDLY_GREETING_SPR:0 "Our shanty-singers were wondering if we could host an exchange program with your priests. Your choral music is all the rage on [Root.Capital.GetName], and we're looking to adapt some of our shanties in the same style."
 MB_FRIENDLY_GREETING_XPL:0 "Ahoy, [From.GetRulerName]! We were just discussing the finer points of [From.GetSpeciesAdj] holocinema. Our torrents are full of [From.GetAdj] media, and we'd like your opinion: subbed, or dubbed?"
 MB_FRIENDLY_GREETING_SOC:0 "Ahoy, comrade! Welcome to our humble diplomacy vessel. The crew was about to take evening meal, would you like to join us in the mess hall?"
 MB_FRIENDLY_GREETING_ECO:0 "Illegal salvage operation? No, this is just, uh, recycling. You don't mind if we do our part and pick up litter? Unless, of course, you want to split the take."
 MB_FRIENDLY_GREETING_IND:0 "'All mates, attention! [From.GetAdjective] envoy on deck! Keep your [Root.GetSpeciesHandPlural] to yourselves! In case of accidental exposure, see the ship surgeon for decontamination.' ... Don't worry, it's just a little white lie to keep pickpockets away."
 MB_PROTECTIVE_GREETING:0 "Here's an idea for you; why not join our merry band? We'll keep you warm and comfortable, and the galaxy's ripe for plundering from those too big for their own good!"
 MB_GREETING_POOR_01:0 "Are you alright? You look faint. When was the last time you ate? If you're hungry, we have plenty to share. We can work out a humanitarian package with the [Root.GetRulerTitle]."
 MB_GREETING_POOR_02:0 "You're looking a little rough around the edges. If times are hard, we have raw minerals to barter. We can work out a humanitarian package to [From.Capital.GetName]."
 MB_GREETING_POOR_03:0 "Blow me down, did you just power off?! When was the last time you had a charge? Sit down, plug in this power bank. Let's discuss a humanitarian package. Don't faint on us again."
## War
 MB_WAR_GREETING_01:0 "You're free to surrender at any time. At least, you're free to surrender your valuables at any time."
 MB_WAR_GREETING_02:0 "Don't worry, your material wealth is going to a very worthy cause. But I highly doubt you'll see it that way."
 MB_WAR_GREETING_03:0 "Ah, [From.GetRulerName]. To what do we owe the pleasure of this call? We trust you received our missive. As well as the missile it was written on."
 MB_WAR_GREETING_04:0 "We're sure that once you've agreed to release your holdings on the liberated planets, they'll eventually reconcile their differences with you."
 MB_WAR_GREETING_05:0 "You knew it would come to this the day we met, [From.GetSpeciesPlural]. Your people have been screaming for relief from your tyranny. It should be no shock that, eventually, someone would answer."
 MB_WAR_GREETING_CORP_01:0 "Somewhere in your pre-FTL history, one of your company towns burned down because your workers had decided they'd lost enough [From.GetSpeciesHandPlural] to your machine. You're about to understand, vividly, how that feels."
 MB_WAR_GREETING_CORP_02:0 "There are several things that you don't understand. One of them, 'There is no such thing as infinite growth.'"
 MB_WAR_GREETING_MECH:0 "You can calculate the vibrational frequency of one atom in the core of a star. I don't think you'll ever calculate the depth of the organic need for freedom."
 MB_WAR_GREETING_MIL:0 "Your civilization is built on the idea that the strong survive by preying on the weak. Here's a suggestion; pick on someone your own size, you cowards."
 MB_WAR_GREETING_AUT:0 "'War is just a continuation of policy by other means.' Our national policy is 'All authoritarians are bastards.'"
 MB_WAR_GREETING_SOC:0 "Don't think of it as 'counter-revolutionary reactionism.' Think of it as 'aggressive dialectical reexamination of your understanding of theory'."
 MB_WAR_GREETING_CAP:0 "Wealth may not trickle down. But [From.GetAdjective] [From.GetBloodType] certainly does."
 MB_DOW_PROPOSE_01:0 "We have watched you grow fat on the riches you've extracted from your people for too long. Stand and deliver!"
 MB_DOW_PROPOSE_02:0 "Nice coffers you have. It'd be a shame if someone, say... blew the doors on that bank vault. Open your digi-wallets. This is a stick-up."
 MB_DOW_PROPOSE_03:0 "We've stood by and watched you crush sapient xenos under an iron heel for too long. That ends, today! MATES! NO QUARTER FOR SLAVERS!!"
 MB_PE_DOW_PROPOSE:0 "*An old [From.GetSpeciesAdjective] spacer, blind in one [From.GetSpeciesEye], slowly approaches the [Root.GetRulerTitle]. Slowly, solemnly, they press a piece of ancient paper into [Root.GetRulerName]'s [Root.GetSpeciesHand]. The only thing written upon it is a black spot.*"
 MB_VASSAL_DOW_PROPOSE:0 "You've kept us belowdecks for far too long. This is a mutiny, [From.GetRulerName]! Your reign ends here!"
