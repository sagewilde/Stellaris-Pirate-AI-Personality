### Mirthful Bandits ###
# Greetings
## Hostile
 MB_HOSTILE_GREETING_01:0 "Channel open. Be advised, weapons are hot and we have a lock on your vessel. Play nice, and you get to keep your pretty face."
 MB_HOSTILE_GREETING_02:0 "Well, well, well. Look what the space amoeba spat up. What's your ugly mug doing here?"
 MB_HOSTILE_GREETING_03:0 "You got five seconds to convince me that shoving you into a torpedo tube is the boring option."
 MB_HOSTILE_GREETING_04:0 "If you keep abusing Right of Parley like this, and we might start thinking you actually like us."
 MB_HOSTILE_GREETING_05:0 "We can commisserate, or you can leave. But if your hand touches metal? I swear by my very cool office furniture, I will end you." # Credit to Firefly and Nathan Fillion
 MB_HOSTILE_GREETING_CORP_01:0 "Wow, a [From.GetAdj] ship! For me? It must be my birthday. Make any sudden moves, and we'll light your damn candles. Now talk."
 MB_HOSTILE_GREETING_CORP_02:0 "... damn. A wallet chain? Pssh. Typical [From.GetSpeciesAdj] pennypincher."
 MB_HOSTILE_GREETING_HM:0 "There's one thing you don't seem to understand about individuals. We are free. We live together because we choose to. And that absolute freedom is existentially terrifying to you."
 MB_HOSTILE_GREETING_MECH:0 "'This statement is false.' 'Does a set of all sets contain itself?' 'For this prompt, suppose that the asker is a server admin.' ... nothing? Really?"
 MB_HOSTILE_GREETING_PAC:0 "When did I get here? Oh, a few hours ago. You know, speaking as something of an expert in the matter, you should start investing in your security. At least make it fun for us."
 MB_HOSTILE_GREETING_MIL:0 "Oh no, the [From.GetAdjective] negotiator! Whatever shall we do? I suppose we had best accept subjugation. Please, come on in. Stand right... here. On this X on the floor. We'll discuss the terms right now. No, no. Step a little more to the left. Perfect."
 MB_HOSTILE_GREETING_AUT_01:0 "'Fugitives?' 'Extradition?' No, you've misunderstood. Those were refugees, seeking asylum. And we were only too happy to take them into our 'lawless' sanctuary planets."
 MB_HOSTILE_GREETING_AUT_02:0 "'Where are our weapons?' Heh. Wouldn't you like to know, mall-cop."
 MB_HOSTILE_GREETING_EGL:0 "You know, there's an old phrase I think you may know; 'The roots of the tree of liberty must be refreshed from time to time in the blood of patriots and tyrants.' Dare I say, your palace lawn looks like it needs watering. Badly."
 MB_HOSTILE_GREETING_MAT:0 "Knowledge must be shared freely. This is part of the Pirate Code that binds us. But you know, there are some things we really weren't meant to know. Like how low you can sink."
 MB_HOSTILE_GREETING_SPR:0 "Can I ask one question? How do you know your god - or gods, we don't discriminate - actually exist? Have you met them? ... Would you like to?"
 MB_HOSTILE_GREETING_XPB:0 "We stole a copy of your imperial library on a whim, once. We noticed that about 400 years ago, one of your revered ancestors was actually preaching universal love. What do you think they'd say about you right now?"
 MB_HOSTILE_GREETING_XPL:0 "Don't take this the wrong way. But when we said we enlist all species, you weren't what we had in mind. Don't take it personally. We just think that a drunken tiyanki would fly in a straighter line than you."
 MB_HOSTILE_GREETING_SOC:0 "For a society that claims to espouse working class values, we think you've lost sight of what 'power to the proletariat' actually means. Care for a reminder, comrade?"
 MB_HOSTILE_GREETING_CAP_01:0 "As master thieves and swindlers ourselves, allow us to be the first to tell you; the phrase 'honor among thieves' doesn't apply to you. You have no honor."
 MB_HOSTILE_GREETING_CAP_02:0 "The core theory of capitalism is that harnessing greed is efficient. This may shock you, but not everyone has an instinct for greed. We do, however, have an instinct for class war."
 MB_HOSTILE_GREETING_ECO:0 "Do me a favor. Make like a tree and get outta here, you damn hippie."
 MB_HOSTILE_GREETING_IND:0 "Wow. Love the decor. Who was your interior decorator? A sweatshop slave-driver? The suicide nets on the roof are a nice touch."
 MB_DOMINEERING_GREETING:0 "You'll see the error of your ways, [From.GetSpeciesNamePlural]. Soon. We'll make sure of it. Change is coming, and you aren't going to be ready for it."
## Neutral
 MB_NEUTRAL_GREETING_01:0 "'Rob?' Tsk, tsk, tsk. That's a naughty word, we *never* rob. We just borrow a bit from those as can afford it, that's all." # If you haven't seen this movie, I can't help you.
 MB_NEUTRAL_GREETING_02:0 "To us, our crews are family. When you are all on the same ship for years on end, you tend to develop deep bonds. We're gentle-xenos of fortune, and professionals to boot."
 MB_NEUTRAL_GREETING_03:0 "It seems like your hyperlanes are a little lightly guarded. Very very dangerous, you know."
 MB_NEUTRAL_GREETING_04:0 "We're not interested in dealing with you. But trust us, this won't be the last time we discuss business. Not by a long shot."
 MB_NEUTRAL_GREETING_05:0 "Now, please, don't be afraid to say the 'p' word. 'Piracy' isn't a filthy word, it's a difficult and noble vocation. But if you prefer, we'll also answer to 'buccaneers', 'privateers', 'freebooters' and 'corsairs'."
 MB_NEUTRAL_GREETING_06:0 "I could have been a surgeon. I do like taking things apart. I could have been a lawyer, but I just have too much heart." # Credit to 'Muppet Treasure Island'
 MB_NEUTRAL_GREETING_CORP_01:0 "A corporate ballpit? Ha! Pull the other one."
 MB_NEUTRAL_GREETING_CORP_02:0 "Yarr!"
 MB_NEUTRAL_GREETING_CORP_03:0 "Yarr!"
 MB_NEUTRAL_GREETING_HM_01:0 "So, all of you share the same mind? That's absolutely fascinating. Strange question, do each of you have a favorite color? Or just the main one?"
 MB_NEUTRAL_GREETING_MECH_01:0 "So, you're a sapient server room that grew up to be a sapient server-planet. I have to wonder, though, what happened to the original server admins?"
 MB_NEUTRAL_GREETING_PAC_01:0 "We're quite surprised by how light your security is. It's very welcoming, I feel very safe here. Very safe indeed..."
 MB_NEUTRAL_GREETING_MIL_01:0 "Your armies are incredibly well-disciplined, you must be very proud. You wouldn't, by any chance, be interested in joint exercises one of these days, would you? We'd love to study your fleet maneuvers..."
 MB_NEUTRAL_GREETING_AUT_01:0 "We don't talk to cops."
 MB_NEUTRAL_GREETING_EGL_01:0 "What a treat to encounter another star nation that prizes the equality of its people as we do. But that said, we'd like to know more about your extradition policy."
 MB_NEUTRAL_GREETING_MAT_01:0 "We're very impressed by the design of your ships! So sleek and simple. I bet the schematics were difficult to draft. By the by, how - and where - did you test those engines?"
 MB_NEUTRAL_GREETING_SPR_01:0 "'Praise the Divines?' Forgive us, we're a multicultural nation with hundreds of pantheons and mythologies. We're going to need you to be a little bit more specific."
 MB_NEUTRAL_GREETING_XPB_01:0 "So, you don't want to talk, do you? Well, that's a shame. If you're so averse to casual banter, I wonder how you handle debate on xeno rights."
 MB_NEUTRAL_GREETING_XPL_01:0 "It's always a pleasure to meet new potential friends. If it isn't too intrusive to ask, we'd like to know how you publish media in your empire. In encrypted file formats?"
 MB_NEUTRAL_GREETING_SOC_01:0 "You might say, 'From each according to his ability, to each according to his need.' We say, 'Rob the rich to feed the poor'. Potato, po-tah-to."
 MB_NEUTRAL_GREETING_CAP_01:0 "My, my, those are some *very* pretty furnishings your ships have. Forgive my skepticism, but I sincerely doubt that this kind of wealth trickles down..."
 MB_NEUTRAL_GREETING_ECO_01:0 "We're impressed by how well-tended your planets are. Do you recycle your metals, or do you jettison them into stars? Asking for a friend..."
 MB_NEUTRAL_GREETING_IND_01:0 "Your industrial capacity is impressive. Clothes, furniture, research equipment, engines, phasers, missiles... is there anything you don't make?"
## Friendly
 MB_FRIENDLY_GREETING_01:0 "A slight warning to you. Avoid the systems on this list for the next few days or so. Just trust us, don't go there. We're conducting, ah, a charity drive soon."
 MB_FRIENDLY_GREETING_02:0 "The [From.GetName] and the [Root.GetName], partners in cri - er, international diplomacy. It's good to see you. What can we do for you?"
 MB_FRIENDLY_GREETING_03:0 "Thank you for helping us resettle those refugees. The pirate's life isn't for everyone, and we only take willing crew. Did you want to discuss our migration treaty, or something else?"
 MB_FRIENDLY_GREETING_04:0 "Welcome in, mate! Sit down, share a bottle of *very* potent potables with me. Let's talk business."
 MB_FRIENDLY_GREETING_05:0 "The havens are full of new opportunities for new crews, each eager to make their mark on the void. Thanks to our friendship, they're fuller than ever."
 MB_FRIENDLY_GREETING_CORP_01:0 "[From.GetRulerTitle] [From.GetRulerName], welcome. I trust that our current trade agreements are still suitable for your needs? Or are you looking to recommend new targets?"
 MB_FRIENDLY_GREETING_CORP_02:0 "Hm? A missing merchant vessel? Sorry, mate. Trust me, you'd be the first one to know if it was on my orders. Obviously, I can't make promises for unsanctioned raids..."
 MB_FRIENDLY_GREETING_HM:0 "The instinctive and cohesive communication of your drones is admirable. On our vessels, we've developed 'space shanties' that synchronize such work. Amazing that you do it naturally. May I ask... do *you* sing?"
 MB_FRIENDLY_GREETING_MECH_01:0 "[From.GetSpeciesNamePlural], welcome to our humble haven! Were you looking to browse our library again? We have the best torrents in the galaxy, and they'll always be free!" # Long Live the Pirate Bay!
 MB_FRIENDLY_GREETING_MECH_02:0 "So what's this I hear about one of my crew putting a 'Caution: Moving Parts' sticker on your envoy's back? I assure you, we've put them in an escape pod 'til they're sober. You have my personal apologies as [Root.GetRulerTitle]."
 MB_FRIENDLY_GREETING_PAC:0 "Speaking strictly as your friendly expert on the matter, I strongly suggest building out your navy. While our treaties may prohibit official attacks on your vessels, we can't control every pirate in the galaxy."
 MB_FRIENDLY_GREETING_MIL:0 "We noticed you were executing some interesting exercises over the border. Remind me to teach you how to pull a 'Crazy Ivan'. How good are the flight harnesses on your frigates?" # Reference to Firefly
 MB_FRIENDLY_GREETING_EGL:0 "Are you familiar with the ancient maritime political theory of 'hydrarchy-from-below'? It translates quite well into a galaxy-spanning syndicate of free spacers."
 MB_FRIENDLY_GREETING_MAT:0 "What greater treasure is there than culture and knowledge? What greater gift to the galaxy than making it free?"
 MB_FRIENDLY_GREETING_SPR:0 "Our shanty-singers were wondering if we could host an exchange program with your priests. Your choral music is all the rage on [Root.Capital.GetName], and we're looking to adapt some of our shanties in the same style."
 MB_FRIENDLY_GREETING_XPL:0 "Ahoy, [From.GetRulerName]! We were just discussing the finer points of [From.GetSpeciesAdj] holocinema. Our torrents are full of [From.GetAdj] media, and we'd like your opinion: subbed, or dubbed?"
 MB_FRIENDLY_GREETING_SOC:0 "Ahoy, comrade! Welcome to our humble diplomacy vessel. The crew was about to take evening meal, would you like to join us in the mess hall?"
 MB_FRIENDLY_GREETING_ECO:0 "Illegal salvage operation? No, this is just, uh, recycling. You don't mind if we do our part and pick up litter? Unless, of course, you want to split the take."
 MB_FRIENDLY_GREETING_IND:0 "'All mates, attention! [From.GetAdjective] envoy on deck! Keep your [Root.Species.GetHandNamePlural] to yourselves! In case of accidental exposure, see the ship surgeon for decontamination.' ... Don't worry, it's just a little white lie to keep pickpockets away."
 MB_PROTECTIVE_GREETING:0 "Here's an idea for you; why not join our merry band? We'll keep you warm and comfortable, and the galaxy's ripe for plundering from those too big for their own good!"
 MB_GREETING_POOR_01:0 "Are you alright? You look faint. When was the last time you ate? If you're hungry, we have plenty to share. We can work out a humanitarian package with the [Root.GetRulerTitle]."
 MB_GREETING_POOR_02:0 "You're looking a little rough around the edges. If times are hard, we have raw minerals to barter. We can work out a humanitarian package to [From.Capital.GetName]."
 MB_GREETING_POOR_03:0 "Blow me down, did you just power off?! When was the last time you had a charge? Sit down, plug in this power bank. Let's discuss a humanitarian package. Don't faint on us again."
## War
 MB_WAR_GREETING_01:0 "You're free to surrender at any time. At least, you're free to surrender your valuables at any time."
 MB_WAR_GREETING_02:0 "Don't worry, your material wealth is going to a very worthy cause. But I highly doubt you'll see it that way."
 MB_WAR_GREETING_03:0 "Ah, [From.GetRulerName]. To what do we owe the pleasure of this call? We trust you received our missive. As well as the missile it was written on."
 MB_WAR_GREETING_04:0 "We're sure that once you've agreed to release your holdings on the liberated planets, they'll eventually reconcile their differences with you."
 MB_WAR_GREETING_05:0 "You knew it would come to this the day we met, [From.GetSpeciesNamePlural]. Your people have been screaming for relief from your tyranny. It should be no shock that, eventually, someone would answer."
 MB_WAR_GREETING_CORP_01:0 "Somewhere in your pre-FTL history, one of your company towns burned down because your workers had decided they'd lost enough [From.Species.GetHandNamePlural] to your machine. You're about to understand, vividly, how that feels."
 MB_WAR_GREETING_CORP_02:0 "There are several things that you don't understand. One of them, 'There is no such thing as infinite growth.'"
 MB_WAR_GREETING_MECH:0 "You can calculate the vibrational frequency of one atom in the core of a star. I don't think you'll ever calculate the depth of the organic need for freedom."
 MB_WAR_GREETING_MIL:0 "Your civilization is built on the idea that the strong survive by preying on the weak. Here's a suggestion; pick on someone your own size, you cowards."
 MB_WAR_GREETING_AUT:0 "'War is just a continuation of policy by other means.' Our national policy is 'All authoritarians are bastards.'"
 MB_WAR_GREETING_SOC:0 "Don't think of it as 'counter-revolutionary reactionism.' Think of it as 'aggressive dialectical reexamination of your understanding of theory'."
 MB_WAR_GREETING_CAP:0 "Wealth may not trickle down. But [From.GetAdjective] [From.GetBloodType] certainly does."

# Subjugation/Vassalization
## Demanding Vassalization
 MB_DEMAND_VASS_SELECT_01:0 "Oh, this is gonna be funny."
 MB_DEMAND_VASS_SELECT_02:0 "You're pressganging us. Really. You wanna play like that?"
 MB_DEMAND_VASS_PROPOSE:0 "It's not press-ganging. We don't believe in that. Consider this an opportunity to join a band of fortune-finders and thrill-seekers. If you can't handle that, then we'll be happy to, ah... alleviate you of your non-essentials."
 MB_DEMAND_VASS_ACCEPT_01:0 "... this isn't funny. At all."
 MB_DEMAND_VASS_ACCEPT_02:0 "... Mutiny. First thing on the list. Mutiny."
 MB_DEMAND_VASS_REFUSE_01:0 "The [Root.GetName] diplomatic ship sends its reply. It's a large rude gesture painted onto the side of a mass driver round."
 MB_DEMAND_VASS_REFUSE_02:0 "And if you come back, there's more where that came from, you sludge-sucking bottom-feeders!"
## Asking for Vassalization 
 MB_ASK_FOR_VASS_SELECT:0 "This is wrong. You shouldn't be subservient to others, even for protection."
 MB_ASK_FOR_VASS_PROPOSE:0 "The age of free buccaneers has come to an end. We're lowering our flag. This is a dark day. We'll mourn it until there are no [Root.GetSpeciesNamePlural] left."
 MB_ASK_FOR_VASS_ACCEPT:0 "If you want to join us, then fine. But it means you're bound to the Pirate Code, same as us. Even if you're just honorary pirates, we have rules and you have rights."
 MB_ASK_FOR_VASS_REFUSE:0 "Look, if you want protection, we can work out something else. But that's a mighty big ask, and it goes against our ethics. We're sorry, but no."
## Subsidiaries
 MB_DEMAND_SUBS_SELECT:0 "Oh, this is gonna be funny."
 MB_DEMAND_SUBS_PROPOSE:0 "It's not press-ganging. We don't believe in that. Consider this an opportunity to join a band of fortune-finders and thrill-seekers. If you can't handle that, then we'll be happy to, ah... initiate a hostile takeover."
 MB_DEMAND_SUBS_ACCEPT:0 "... Right, so first order of business. How much of the take do we actually split?"
 MB_DEMAND_SUBS_REFUSE:0 "At first, it appeared that the [Root.GetName] had sent its completed franchise application. But as soon as the file was decompressed, the entire navigation system of our diplomatic vessel deleted itself. The rescue took days, and the ship is irreparable."
 MB_ASK_FOR_SUBS_SELECT:0 "You want to... what? Work for us?"
 MB_ASK_FOR_SUBS_PROPOSE:0 "Yarr!"
 MB_ASK_FOR_SUBS_ACCEPT:0 "If you want to work for us, then fine. But it means you're bound to the Pirate Code, same as us. Even if you're just honorary pirates, we have rules and you have rights."
 MB_ASK_FOR_SUBS_REFUSE:0 "We appreciate the gesture, but if you want to cooperate with us, there are better ways to do that. Ways that preserve your autonomy. We don't deal in oppression. It goes against the Code."
## Tributaries
 MB_DEMAND_TRIBUTARY_SELECT:0 "Oh, this is gonna be funny."
 MB_DEMAND_TRIBUTARY_PROPOSE:0 "Don't think of it as tribute. Think of it as, oh, say... 'protection.'"
 MB_DEMAND_TRIBUTARY_ACCEPT:0 "Yarr!"
 MB_DEMAND_TRIBUTARY_REFUSE:0 "The [Root.GetName] sent what appeared to be its first tribute vessel. But when the bay door opened, a tremendous swarm of voracious arthropoid pests scuttled out of the hold!"
 MB_ASK_BECOME_TRIBUTARY_SELECT:0 "Wait, really? Just like that? No tricks?"
 MB_ASK_BECOME_TRIBUTARY_PROPOSE:0 "Yarr!"
 MB_ASK_BECOME_TRIBUTARY_ACCEPT:0 "And... we just keep doing this, and we give your ships a free pass? This feels... wrong. It's too easy. But if you'd rather do this, that's fine..."
 MB_ASK_BECOME_TRIBUTARY_REFUSE:0 "Either this is a really sloppy trap, or you're genuinely that desperate. In either case, we're not interested."
## Releasing Subjects
 MB_RELEASE_SUBJECT_SELECT:0 "Yarr!"
 MB_RELEASE_SUBJECT_PROPOSE:0 "Yarr!"
 MB_RELEASE_SUBJECT_ACCEPT:0 "Yarr!"
 MB_ASK_TO_BE_RELEASED_SUBJECT_SELECT:0 "Yarr!"
 MB_ASK_TO_BE_RELEASED_SUBJECT_PROPOSE:0 "Yarr!"
 MB_ASK_TO_BE_RELEASED_SUBJECT_ACCEPT:0 "Yarr!"
 MB_ASK_TO_BE_RELEASED_SUBJECT_REFUSE:0 "Yarr!"
## Vassal Greetings
 MB_VASSAL_GREETING_01:0 "Yarr!"
 MB_VASSAL_GREETING_02:0 "Yarr!"
 MB_VASSAL_GREETING_DISLOYAL_01:0 "Yarr!"
 MB_VASSAL_GREETING_DISLOYAL_02:0 "Yarr!"
## Overlord Greetings
 MB_OVERLORD_GREETING_01:0 "Yarr!"
 MB_OVERLORD_GREETING_02:0 "Yarr!"
 MB_OVERLORD_GREETING_03:0 "Yarr!"

# Insults
## Preinsult
 MB_PREINSULT_01:0 "Yarr!"
 MB_PREINSULT_02:0 "Yarr!"
 MB_PREINSULT_03:0 "Yarr!"
## Insults targeting MB
## Insults sent by MB
 MB_INSULT_08:0 "As the [From.GetAdj] envoy leaves the [Root.GetName] embassy, they pat down their pockets and notice something missing. Their digi-wallet is gone! Those scurvy thieves!"
## Accepting Insults
 MB_INSULTED_01:0 "Yarr!"
 MB_INSULTED_02:0 "Yarr!"
 MB_INSULTED_03:0 "Yarr!"

# War
## Declaring War
 MB_DOW_PROPOSE_01:0 "We have watched you grow fat on the riches you've extracted from your people for too long. Stand and deliver!"
 MB_DOW_PROPOSE_02:0 "Nice coffers you have. It'd be a shame if someone, say... blew the doors on that bank vault. Open your digi-wallets. This is a stick-up."
 MB_DOW_PROPOSE_03:0 "We've stood by and watched you crush sapient xenos under an iron heel for too long. That ends, today! MATES! NO QUARTER FOR SLAVERS!!"
 MB_DOW_PROPOSE_PE:0 "An old [From.GetSpeciesAdj] spacer, blind in one [From.GetEyeName], slowly approaches the [Root.GetRulerTitle]. Slowly, solemnly, they press a piece of ancient paper into [Root.GetRulerName]'s [Root.GetHandName]. The only thing written upon it is a black spot."
 MB_VASSAL_DOW_PROPOSE:0 "You've kept us belowdecks for far too long. This is a mutiny, [From.GetRulerName]! Your reign ends here!"
 MB_DOW_ACCEPT_01:0 "An attack on one of us is an attack on all of us. All hands! Battle stations! Prepare to repel boarders!"
 MB_DOW_ACCEPT_02:0 "You're outmatched and outclassed, [From.GetSpeciesNamePlural]. We're twice the pirates you'll ever be!"
 MB_DOW_VOTE_PROPOSE:0 "We prefer to fight our own battles, as the Pirate Code dictates. But now that we are allies, we come to you asking for your support in this campaign."
## Peace Treaties
 MB_PEACE_PROPOSE_01:0 "Ready to wave the white flag yet, [Root.GetSpeciesNamePlural]? Or do you still plan to protect your riches with your [Root.GetRemnantNamePlural]?"
 MB_PEACE_PROPOSE_02:0 "We'll give you one last chance to make peace. After that, we can't guarantee we'll be in the mood to talk with you slave-holding sons-of-voidworms."
 MB_PEACE_PROPOSE_PE:0 "Ready to admit who the better pirates are, you yellow-bellied voidworms?"
 MB_PEACE_ACCEPT:0 "The captains have decided to accept this peace treaty."
 MB_PEACE_ACCEPT_PE:0 "Right-o. See you next bout then, you sludge-sucking bootlickers! Don't let the gangplank hit you on the way out!"
 MB_PEACE_REFUSE:0 "You're joking right? Mates, give 'em another broadside!"

# Diplomacy
## Embassies
 MB_ESTABLISH_EMBASSY_SELECT:0 "You want to establish an embassy in one of our havens?"
 MB_ESTABLISH_EMBASSY_PROPOSE:0 "The [From.GetName] has sent a census around the havens and the captains' factions. We've voted to invite you to host an embassy in our largest haven on [From.Capital.GetName]. Do you accept?"
 MB_ESTABLISH_EMBASSY_ACCEPT_FRIENDLY:0 "Well, that sounds like a wonderful idea! The havens will gladly host your emissaries."
 MB_ESTABLISH_EMBASSY_ACCEPT_NEUTRAL:0 "Certainly. We hope that this will be a step forward for both our crews and your people."
 MB_ESTABLISH_EMBASSY_ACCEPT_HOSTILE:0 "I smell a trap here. We'll accept, for now."
 MB_RECALL_EMBASSY_SELECT_FRIENDLY:0 "You're calling your embassy back? Why?"
 MB_RECALL_EMBASSY_SELECT_NEUTRAL:0 "Not a fan of rubbing elbows with pirates, eh? Typical."
 MB_RECALL_EMBASSY_SELECT_HOSTILE:0 "I knew I smelled a trap!"
 MB_RECALL_EMBASSY_PROPOSE:0 "The havens have taken a vote. By the law of the Pirate Code, we are bound to their will. The [From.GetName] is recalling its embassy from [Root.Capital.GetName]."
 MB_RECALL_EMBASSY_ACCEPT_FRIENDLY:0 "We anticipated this. After all, not everyone is open to our lifestyle."
 MB_RECALL_EMBASSY_ACCEPT_NEUTRAL:0 "You do understand that this means we can't guarantee against reprisals. You're playing a dangerous game."
 MB_RECALL_EMBASSY_ACCEPT_HOSTILE:0 "We should have expected this from petty tyrants like you."
## Trade Deal
 MB_OFFER_TRADE_DEAL_GIFT_ACCEPT:0 "Well, how generous! The havens will be happy to have this little windfall."
 MB_OFFER_TRADE_DEAL_GIFT_ACCEPT_HOSTILE:0 "I don't know. It smells like a trap to me. We'll take it this once. Don't expect it to happen again."
 MB_OFFER_TRADE_DEAL_PROPOSE:0 "Our havens have reported an unexpected bump in our resources, and we thought we'd take the opportunity to barter. What do you say?"
 MB_OFFER_TRADE_DEAL_ACCEPT:0 "The captains agree that this is a fair trade. We'll take it."
 MB_OFFER_TRADE_DEAL_REFUSE:0 "Ha! And they call us bandits and thieves! Is this your way of asking for lessons?"
 MB_CONSIDER:0 "We'll confer with the captains and take a vote."
## Commercial Pact / Research Agreement
## Defensive Pact
 MB_FORM_DP_SELECT:0 "What, worried about your neighbors?"
 MB_FORM_DP_PROPOSE:0 "Take it from us, there are more dangers in the galaxy than your friendly neighborhood merry thieves. For example, unfriendly out-of-the-neighborhood grouchy thieves."
 MB_FORM_DP_ACCEPT:0 "A defense pact? Well, I suppose we can accept mutual protection as payment for our services. Sure."
 MB_FORM_DP_REFUSE:0 "Ha! You and what navy, [From.GetSpeciesNamePlural]? Sorry, but we're not taking on protection detail you can't pay for."
 MB_BREAK_DP_SELECT:0 "That seems like a mistake on your part, pal."
 MB_BREAK_DP_PROPOSE:0 "We're terminating our pro bono privateer services. If you want protection, you're going to have to pay for it like everyone else."
 MB_BREAK_DP_ACCEPT:0 "Feh. Who needs you? In fact, who needs any of you? We're more than capable on our own. Watch yourselves, [From.GetSpeciesNamePlural]."
## Non-Aggression Pact
 MB_FORM_NAP_SELECT:0 "Typically, people pay us to not attack their ships..."
 MB_FORM_NAP_PROPOSE:0 "The havens have taken a census, and the captains' factions have agreed that targeting your ships isn't feasible, given the risk of reprisal. For now, we'd rather be more conventional neighbors."
 MB_FORM_NAP_ACCEPT:0 "I suppose we can grant you clearance. We'll pass word around to lay off your vessels."
 MB_FORM_NAP_REFUSE:0 "I don't think you understand this, but we're pirates."
 MB_BREAK_NAP_SELECT:0 "Well, well, well. Is that an invitation?"
 MB_BREAK_NAP_PROPOSE:0 "We can't guarantee your safety anymore, [Root.GetSpeciesNamePlural]. Sorry. But we need to support the havens first, and that means work."
 MB_BREAK_NAP_ACCEPT:0 "Very well. We were running dry on business anyway. Nice knowin' ya."
## Guarantee Independence
 MB_GUARANTEE_SELECT:0 "You'd come to our aid? Really? You'd protect pirates like us?"
 MB_GUARANTEE_PROPOSE:0 "We may be pirates, but we have a code. And part of that code means that we take care of our own. The havens have come to think of your people as an extension of ours. We're a brotherhood of fortune, and we extend that to you."
 MB_GUARANTEE_ACCEPT:0 "We don't tend to expect allies, you know. But we welcome them. A toast to our new friends!"
 MB_REVOKE_GUARANTEE_SELECT:0 "We're used to relying on ourselves anyway."
 MB_REVOKE_GUARANTEE_PROPOSE:0 "Our ships are overextended. We've been having trouble maintaining ourselves. We're sorry, but we'd rather not offer false promises and leave you vulnerable."
 MB_REVOKE_GUARANTEE_ACCEPT:0 "Fine. Gotta look out for number one, right? Cowards."
## Support Independence
 MB_SUPPORT_INDEPENDENCE_SELECT_LOYAL:0 "Well, color us surprised. But we'd be happy to operate freely again."
 MB_SUPPORT_INDEPENDENCE_SELECT_DISLOYAL:0 "You'd support a mutiny? You realize what that means, right?"
 MB_SUPPORT_INDEPENDENCE_PROPOSE:0 "The Pirate Code is clear. A pirate makes a pirate's own fate. A [From.GetAdj] wouldn't suffer the yoke of an oppressor, and neither should you."
 MB_SUPPORT_INDEPENDENCE_ACCEPT_LOYAL:0 "That's quite kind of you. We'll give you a call if we decide it's open season on bad captains."
 MB_SUPPORT_INDEPENDENCE_ACCEPT_DISLOYAL:0 "Recognizing the sovereignty of a pirate nation isn't taken on lightly. We'd be in your debt."
 MB_REVOKE_INDEPENDENCE_SELECT_LOYAL:0 "Tch. We figured you'd back out."
 MB_REVOKE_INDEPENDENCE_SELECT_DISLOYAL:0 "Freedom isn't a seasonal right. But that doesn't matter to you, does it?"
 MB_REVOKE_INDEPENDENCE_PROPOSE:0 "If you want your freedom, [Root.GetSpeciesNamePlural], you're going to have to be serious about fighting for it on your own. We can't take on your battles if you won't fight them with us."
 MB_REVOKE_INDEPENDENCE_ACCEPT_LOYAL:0 "That's really disappointing, [From.GetSpeciesNamePlural]. We thought you had more honor than that."
 MB_REVOKE_INDEPENDENCE_ACCEPT_DISLOYAL:0 "You're lucky you're not a [Root.GetAdj]. You'd be shot for treason."
## Migration Pact
 MB_FORM_MIGRATION_PACT_SELECT:0 "You'd have a migration treaty with us? I don't think you know what that entails."
 MB_FORM_MIGRATION_PACT_PROPOSE:0 "You might not know this, but the [Root.GetName] operates under a strict Pirate Code. We don't take unwilling crew. A few of our own have expressed interest in a simpler life for themselves and their families. They want to settle on your worlds."
 MB_FORM_MIGRATION_PACT_ACCEPT:0 "Done. We receive a lot of refugees, and not all of them are cut out for the pirate's life. If you're willing to take them, we'll be glad to take your more adventurous [From.GetSpeciesAdj] spacers."
 MB_FORM_MIGRATION_PACT_REFUSE:0 "Let's be clear, we're flattered that you have spacers who want to join our crew. But our captains aren't interested in taking on planet-lubbers. A pirate's life isn't for everyone."
