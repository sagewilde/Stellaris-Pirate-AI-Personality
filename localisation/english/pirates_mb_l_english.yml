# Addressing Mirthful Bandits
## Hostile
 DFLT_MB_HOSTILE_GREETING_01:0 "You and your little band of merry [From.GetSpeciesNameInsult] will be executed summarily if we ever get our [From.Species.GetHandNamePlural] on you!"
 CORP_MB_HOSTILE_GREETING_01:0 "You conniving little thieves won't hide from the [Root.GetAdj] Asset Protection team forever. You'll pay for what you've stolen from us, you miserable gang of shoplifters!"
 MECH_MB_HOSTILE_GREETING_01:0 "Warning: Attempts to hack, disable, or DDOS the [Root.GetName] will result in the deployment of self-defense protocols. You cannot keep randomizing endpoint IDs forever, [From.GetSpeciesNamePlural]"
 HM_MB_HOSTILE_GREETING_01:0 "The [Root.GetName] viciously guards what is rightfully ours, [From.GetSpeciesNamePlural]. Your raids on our logistics vessels will be reprised with deadly force."
## Neutral
 DFLT_MB_NEUTRAL_GREETING_01:0 "You seem to style yourselves as rescuers of the common people. But rest assured, vigilantism is punished as harshly as piracy in the [Root.GetName]."
 CORP_MB_NEUTRAL_GREETING_01:0 "'Rob the rich to feed the poor', eh? Feh. Good luck dealing with our asset protection unit, [From.GetSpeciesNamePlural]. Because they're going to love the bonuses they get for knocking you out."
 MECH_MB_NEUTRAL_GREETING_01:0 "Warning: Attempts to decompile, modify, or republish [From.GetName] source code will be considered hostile action, [From.GetSpeciesNamePlural]. You wouldn't download a shuttle."
 HM_MB_NEUTRAL_GREETING_01:0 "The [Root.GetName] will be watching you particularly closely, [From.GetSpeciesNamePlural]. Attempts to reappropriate our resources will not be looked upon kindly. Even if it is 'for the poor', as you claim."
 THREATENED_MB_GREETING_01:0 "Now, when you say 'Rob the rich to feed the poor', who are you planning to rob, exactly? Surely, you don't mean us...?"
## Friendly
 DFLT_MB_FRIENDLY_GREETING_01:0 "We view the [From.GetSpeciesAdj] spirit as an admirable embrace of personal liberty. Our young [Root.GetSpeciesSpawnNamePlural] seem to idolize tales of your adventures."
 CORP_MB_FRIENDLY_GREETING_01:0 "The whole 'hero of the people' shtick is a very profitable marketing angle, [From.GetSpeciesNamePlural]. We're happy to help you bring collectable memorabilia to market, if you're interested in signing a PR contract."
 MECH_MB_FRIENDLY_GREETING_01:0 "Welcome, [From.GetSpeciesNamePlural]. The [Root.GetName] welcomes your contributions to our cultural database. Our anti-malware routines have been updated since your last upload."
 HM_MB_FRIENDLY_GREETING_01:0 "The collective has come to admire your adventurous spirit, [From.GetSpeciesNamePlural]. May your ships find easy solar winds and safe harbors."
## Pleas for Help
 DFLT_GREETING_POOR_01:0 "Please, our [Root.GetSpeciesSpawnNamePlural] are starving. We have no food, and we're on the brink of collapse. This is our greatest hour of need. The [Root.GetName] entreats you for aid."
 DFLT_GREETING_POOR_02:0 "Our [Root.GetSpeciesSpawnNamePlural] have been reduced to eating gravel to survive. We don't want to beg. But we're caught between a rock and a hard place. We need your help."
 DFLT_GREETING_POOR_03:0 "Our power grid is overextended. [Root.GetSpeciesNamePlural] are powering down in the street. Please, we're begging you, if you have any energy to spare..."
 MECH_GREETING_POOR_01:0 "Warning: Insufficient power... Network latency high... Entering emergency power mode... Activating Distress Signal: Please... help... us..."
 HM_GREETING_POOR_01:0 "The collective is suffering crippling famine. Thousands of us are dying of starvation. It pains us to ask individuals for rescue, but we are at risk of collapse. Please... help us."

# Concerning Hippies
 PC_MB_INSULT_01: "You dudes seem to like to think you're the good guys. Didn't your mothers ever teach you that stealing is wrong, and picking fights isn't cool?"
 MB_PC_INSULT_01: "*As the [From.GetSpecies] envoy leaves the [Root.GetName] embassy, they pat down their pockets and notice something missing. Their baggie of Marin Kharin is gone. The vibe has been harshed.*"