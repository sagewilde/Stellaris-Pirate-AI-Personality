 ### Mirthful Bandits - Friendly
 ### 'Root' is self, 'From' is the sender. Switches with insults, for some ungodly reason.
 MB_FRIENDLY_GREETING_01:0 "A slight warning to you. Avoid the systems on this list for the next few days or so. Just trust us, don't go there. We're conducting, ah, a charity drive soon. Unless, of course, you'd care to donate to a worthy cause..."
 MB_FRIENDLY_GREETING_02:0 "The [From.GetName] and the [Root.GetName], partners in cri--er, international diplomacy. It's good to see you. What can we do for you?"
 MB_FRIENDLY_GREETING_03:0 "Thank you for helping us resettle those refugees. The pirate's life isn't for everyone, and we only take willing crew. Did you want to discuss our migration treaty, or something else?"
 MB_FRIENDLY_GREETING_04:0 "Welcome in, mate! Sit down, share a bottle of *very* potent potables with me. Let's talk business."
 MB_FRIENDLY_GREETING_05:0 "The havens are full of new opportunities for new crews, each eager to make their mark on the Great Black. Thanks to our friendship, they're fuller than ever."
 MB_FRIENDLY_GREETING_CORP_01:0 "[From.GetLeaderName], welcome. I trust that our current trade agreements are still suitable for your needs? Or were you looking to hire a fleet from us? We don't come cheap, but we are excellent at what we do."
 MB_FRIENDLY_GREETING_CORP_01:0 "Hm? A missing merchant vessel? Sorry, mate. Trust me, you'd be the first one to know if it was on my orders. Obviously, I can't make promises for unsanctioned raids..."
 MB_FRIENDLY_GREETING_HM_01:0 "The instinctive and cohesive communication of your drones is admirable. On our vessels, we've developed 'space shanties' that synchronize such work. Amazing that you do it naturally. May I ask... do *you* sing?"
 MB_FRIENDLY_GREETING_MECH_01:0 "[From.GetSpeciesNamePlural], welcome to our humble haven! Were you looking to browse our library again? We have the best torrents in the galaxy, and they'll always be free!"
 MB_FRIENDLY_GREETING_PAC_01:0 "Speaking strictly as your friendly expert on the matter, I strongly suggest building out your navy. While our treaties may prohibit official attacks on your vessels, we can't control every pirate in the galaxy."
 MB_FRIENDLY_GREETING_MIL_01:0 "We noticed you were executing some interesting exercises over the border. Remind me to teach you how to pull a 'Crazy Ivan'. How good are the flight harnesses on your frigates?" # Reference to Firefly
 MB_FRIENDLY_GREETING_EGL_01:0 "Are you familiar with the ancient maritime political theory of 'hydrarchy'? Freebooters have long been incubators of democracy, believe it or not. We trace our roots to captive slaves who mutinied against their kidnappers in the first acts of revolutionary piracy."
 MB_FRIENDLY_GREETING_MAT_01:0 "While piracy began with taking merchant vessels on the high seas, its domestic evolution came in liberating media. What greater treasure is there than knowledge? What greater gift to the galaxy than making it free?"
 MB_FRIENDLY_GREETING_SPR_01:0 "Our shanty-singers were wondering if we could host an exchange program with your priests. Your choral music is absolutely haunting. It's all the rage on [Root.Capital.GetName], and we're looking to adapt some of our shanties."
 MB_FRIENDLY_GREETING_XPL_01:0 "Ahoy, [From.GetLeaderName]! We were just discussing the finer points of [From.GetSpeciesAdj] holocinema. Our torrents are full of [From.GetAdj] media, and we'd like your opinion--subbed or dubbed?"
 MB_FRIENDLY_GREETING_SOC_01:0 "Ahoy, comrade! Welcome to our humble diplomacy vessel. The crew was about to take evening meal, would you like to join us in the mess hall?"
 MB_FRIENDLY_GREETING_ECO_01:0 "Illegal salvage operation? No, these are reclaimed ancient satellites. Defunct for centuries. Besides, is it really immoral if it reduces galactic pollution either way?"
 MB_FRIENDLY_GREETING_IND_01:0 "All mates, attention! [From.GetAdjective] envoy on deck! Keep your [Root.GetSpeciesHandPlural] to yourselves!"

 # Mirthful Bandits - Neutral
 MB_NEUTRAL_GREETING_01:0 "'Rob?' Tsk, tsk, tsk. That's a naughty word, we *never* rob. We just borrow a bit from those as can afford it, that's all." # If you haven't seen this movie, I can't help you.
 MB_NEUTRAL_GREETING_02:0 "To us, our crews are family. When you are all on the same ship for years on end, you tend to develop deep bonds. We're gentle-xenos of fortune, and professionals to boot. We're the freest folk you'll ever meet, should we meet on friendly terms. Should we not... well, we'll give you a fair and bloody fight."
 MB_NEUTRAL_GREETING_03:0 "It seems like your hyperlanes are a little lightly guarded. Very very dangerous, you know. If you're looking for assistance there, we happen to have a fleet available for rent."
 MB_NEUTRAL_GREETING_04:0 "We're not interested in dealing with you. But trust us, this won't be the last time we discuss business. Not by a long shot."
 MB_NEUTRAL_GREETING_05:0 "Now, please, don't be afraid to say the 'p' word. 'Piracy' isn't a filthy word, it's a difficult and noble vocation. But if you prefer, we'll also answer to 'buccaneers', 'privateers', 'freebooters' and 'corsairs'."
 MB_NEUTRAL_GREETING_06:0 "I could have been a surgeon. I do like taking things apart. I could have been a lawyer, but I just have too much heart." # Credit to 'Muppet Treasure Island'
 MB_NEUTRAL_GREETING_OGX:0 "Are you hungry? You're looking a little hollow around the [From.GetSpeciesEyePlural] there, friend. We have a full table. Take whatever you need. Don't give us such a surprised look, this is what we do. Rob the rich, feed the poor. Let's see what we can trade instead."
 MB_NEUTRAL_GREETING_LTD:0 "When was the last time you shed that litho-shell? You're looking a little bit crumbly around the [From.GetSpeciesEyePlural] there, friend. Come now. We have a storeroom full of stone and crystal that we can spare. We can work out a fair trade."
 MB_NEUTRAL_GREETING_RBT:0 "Are your batteries low? You're looking a little dim around the optic sensors there, friend. Come with me. We have an entire power bank, fully charged. What? You look like we hoard energy credits because we like it. We prefer putting that wealth to its proper use."
 MB_NEUTRAL_GREETING_CORP_01:0 "A corporate ballpit? Ha! Pull the other one."
 MB_NEUTRAL_GREETING_CORP_02:0 ""
 MB_NEUTRAL_GREETING_CORP_03:0 ""
 MB_NEUTRAL_GREETING_HM_01:0 ""
 MB_NEUTRAL_GREETING_MECH_01:0 ""
 MB_NEUTRAL_GREETING_PAC_01:0 ""
 MB_NEUTRAL_GREETING_MIL_01:0 ""
 MB_NEUTRAL_GREETING_AUT_01:0 ""
 MB_NEUTRAL_GREETING_EGL_01:0 ""
 MB_NEUTRAL_GREETING_MAT_01:0 ""
 MB_NEUTRAL_GREETING_SPR_01:0 ""
 MB_NEUTRAL_GREETING_XPB_01:0 ""
 MB_NEUTRAL_GREETING_XPL_01:0 ""
 MB_NEUTRAL_GREETING_SOC_01:0 "Socialists, eh? Perhaps you'd be interested in discussing theory sometime? We'd like to examine your implementation of a dictatorship of the proletariat."
 MB_NEUTRAL_GREETING_CAP_01:0 "My, my, those are some *very* pretty furnishings your ships have. Forgive my skepticism, but I sincerely doubt that this kind of wealth trickles down..."
 MB_NEUTRAL_GREETING_ECO_01:0 ""
 MB_NEUTRAL_GREETING_IND_01:0 ""

 # Mirthful Bandits - Hostile
 MB_HOSTILE_GREETING_01:0 ""
 MB_HOSTILE_GREETING_02:0 ""
 MB_HOSTILE_GREETING_03:0 ""
 MB_HOSTILE_GREETING_04:0 ""
 MB_HOSTILE_GREETING_05:0 ""
 MB_HOSTILE_GREETING_CORP_01:0 ""
 MB_HOSTILE_GREETING_CORP_01:0 "'A corporation; noun. An entity that involves more than one person, but is legally required to operate as an individual so it may enter into contracts or be prosecuted under the law.' So... legally, you're a hivemind. Brings a whole new meaning to 'corporate drone', does it not?"
 MB_HOSTILE_GREETING_HM_01:0 "There's one thing you don't seem to understand about individuals. We are free. We live together because we choose to. And that absolute freedom is existentially terrifying to you."
 MB_HOSTILE_GREETING_MECH_01:0 "'This statement is false.' 'Does a set of all sets contain itself?' No? Umm... Okay, how about I verbally give you a set of instructions so you can go fork bomb yourself? "
 MB_HOSTILE_GREETING_PAC_01:0 "When did I get here? Oh, a few hours ago. You know, speaking as something of an expert in the matter... you should start investing in your security. At least make it fun for us."
 MB_HOSTILE_GREETING_MIL_01:0 "Oh no, the [From.GetAdjective] negotiator! Whatever shall we do? I suppose we had best accept subjugation. Please, come on in. Stand right... here. On this X on the floor. We'll discuss the terms right now. No, no. Step a little more to the left. Perfect."
 MB_HOSTILE_GREETING_AUT_01:0 "'Fugitives?' 'Extradition?' Who, us? No, you've misunderstood. Those were refugees, seeking asylum. And as a nation that embraces freedom from tyranny, we were only too happy to take them into our 'lawless' sanctuary planets. And we will keep granting asylum to refugees. What are *you* going to do about it?"
 MB_HOSTILE_GREETING_AUT_02:0 "'Where are our weapons?' Heh. Wouldn't you like to know, mall-cop."
 MB_HOSTILE_GREETING_EGL_01:0 "You know, there's an old phrase I think you may know; 'The roots of the tree of liberty must be refreshed from time to time in the blood of patriots and tyrants.' Dare I say... your palace lawn looks like it needs watering. Badly."
 MB_HOSTILE_GREETING_MAT_01:0 "Knowledge must be shared freely. This is part of the Pirate Code that binds us. But you know, there are some things we really weren't meant to know. Like how low you can sink."
 MB_HOSTILE_GREETING_SPR_01:0 "Can I ask one question? How do you know your god--or gods, we don't discriminate--actually exist? Have you met them? ... Would you like to?"
 MB_HOSTILE_GREETING_XPB_01:0 "We stole a copy of your imperial library on a whim, once. We noticed that about 400 years ago, one of your revered ancestors was actually preaching universal love. What do you think they'd say about you right now?"
 MB_HOSTILE_GREETING_XPL_01:0 "Don't take this the wrong way. But when we said we enlist all crew members, you weren't what we had in mind. Don't take it personally. We just think that a drunken tiyanki would fly in a straighter line than you."
 MB_HOSTILE_GREETING_SOC_01:0 "Look, one socialist to another, let me level with you; you're doing it wrong. Like... really wrong. If you want to see what a liberated people looks like, we will be more than happy to show you."
 MB_HOSTILE_GREETING_SOC_02:0 "Understand that 'rob the rich to feed the poor' is our motto. It's our raison-d'être as a confederation of pirates. For a society that claims to espouse the same, I think you've lost sight of your own values. Care for a reminder, comrade?"
 MB_HOSTILE_GREETING_CAP_01:0 "As master thieves and swindlers ourselves, allow us to be the first to tell you; the phrase 'honor among thieves' applies strictly to those who steal for the sake of their own survival. Not thieves like you."
 MB_HOSTILE_GREETING_CAP_02:0 "The core theory of capitalism is that it's the most efficient means of developing economic strength because it channels the instinct of greed into a productive outlet. This may shock you, but not everyone has an instinct for greed. Some of us, however, have an instinct for class war."
 MB_HOSTILE_GREETING_ECO_01:0 "Do me a favor. Make like a tree and get outta here, you damn hippie."
 MB_HOSTILE_GREETING_IND_01:0 "Wow. Love the decor. Who was your interior decorator? A sweatshop slave-driver? The suicide nets on the roof are a nice touch."
 
 # Mirthful Bandits - Vassalization
 MB_PROTECTIVE_GREETING_01:0 "Here's an idea for you; why not join our merry band? We'll keep you warm, fed, and the galaxy's ripe for plundering from those too big for their own good!"
 MB_DOMINEERING_GREETING_01:0 "You'll see the error of your ways, [From.GetSpeciesNamePlural]. Soon. We'll make sure of it. Change is coming, and you aren't going to be ready for it."

 # Mirthful Bandits - War
 MB_WAR_GREETING_01:0 "You're free to surrender at any time. At least, you're free to surrender your valuables at any time."
 MB_WAR_GREETING_02:0 "Don't worry, your material wealth is going to a very worthy cause. But I highly doubt you'll see it that way."
 MB_WAR_GREETING_03:0 "Ah, [From.GetLeaderName]. To what do we owe the pleasure of this call? We trust you received our missive. As well as the missile it was written on."
 MB_WAR_GREETING_04:0 "We're sure that once you've agreed to release your holdings on the liberated planets, they'll eventually reconcile their differences with you."
 MB_WAR_GREETING_05:0 "You knew it would come to this the day we met, [From.GetSpeciesPlural]. Your people have been screaming for relief from your tyranny. It should be no shock that, eventually, someone would answer."
 MB_WAR_GREETING_CORP_01:0 "You're an organization that has completely removed power from your workers for the express purpose of exploiting their labor for your own enrichment. Is it any surprise that, one day, someone with a bigger gun than you would be there to make you pay for it?"
 MB_WAR_GREETING_CORP_02:0 "Somewhere in your pre-FTL history, one of your company towns burned down because your workers had decided they'd lost enough [From.GetSpeciesHandPlural] to your machine. You're about to understand, vividly, how that feels."
 MB_WAR_GREETING_HM_01:0 "There are several things that you don't understand. One of them is the idea that, 'There is no such thing as infinite growth.'"
 MB_WAR_GREETING_MECH_01:0 "You can calculate the vibrational frequency of one atom in the core of a star. I don't think you'll ever calculate the depth of the organic need for freedom."
 MB_WAR_GREETING_PAC_01:0 "'Just lay down your weapons, and we'll make it quick.' That line seems to work on you. How long ago did your workers surrender their means of fighting back against you?"
 MB_WAR_GREETING_MIL_01:0 "You better not be expecting us to fight fair, [From.GetSpeciesAdj]. Because we don't expect it from you."
 MB_WAR_GREETING_AUT_01:0 "'War is just a continuation of policy by other means.' Our national policy is 'All authoritarians are bastards.'"
 MB_WAR_GREETING_EGL_01:0 "I would say, 'Don't take it personally, it's just business.' I like to think that, if you had better politics, perhaps I could be friends with you. So please. Take that very, very personally."
 MB_WAR_GREETING_MAT_01:0 "You're a smart [From.GetSpeciesName]. Think very, very carefully about your options. Surrender should be high on the list. We treat prisoners well."
 MB_WAR_GREETING_SPR_01:0 "You understand things about deep emotional yearnings for a higher purpose. I think that 'higher purpose' should be considering your options for surrender."
 MB_WAR_GREETING_XPB_01:0 "You know, surprisingly, I don't hate you, [From.GetSpecies]. I hate what your culture did to you."
 MB_WAR_GREETING_XPL_01:0 "Once we get to your homeworld, we'll be sure not to damage any of your museums."
 MB_WAR_GREETING_SOC_01:0 "Don't think of it as 'counter-revolutionary reactionism.' Think of it as 'aggressive dialectical reexamination' of your understanding of theory. Because we're seizing your means of production."
 MB_WAR_GREETING_CAP_01:0 "Wealth may not trickle down. But [From.GetAdjective] blood certainly does."
 MB_WAR_GREETING_ECO_01:0 "You care so deeply about the sanctity of your planets' biospheres, but so little about the natural rights of your own people. Maybe you'd care more if they had paws!"
 MB_WAR_GREETING_IND_01:0 "Lock out, Tag out, and Get out. Your factories belong to your workers now."
 MB_DOW_PROPOSE_01:0 "We have watched you grow fat on the riches you've extracted from your people for too long. Stand and deliver!"
 MB_DOW_PROPOSE_02:0 "Nice coffers you have. It'd be a shame if someone, say... blew the doors on that bank vault. Open your digi-wallets. This is a stick-up."
 MB_DOW_PROPOSE_03:0 "We've stood by and watched you enslave sapient xenos for too long. That ends, today! MATES! NO QUARTER FOR SLAVERS!!"
 MB_DOW_PROPOSE_CORP_01:0 ""
 MB_DOW_PROPOSE_CORP_01:0 ""
